# extenddb postgres docker-compose configuration
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: extenddb-local-dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
