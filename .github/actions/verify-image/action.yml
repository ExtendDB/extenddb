#
# Composite action: check one published image on Docker Hub, by digest,
# before it is promoted or announced. It takes the place of the manual test
# of a candidate in promote-image.yml's release flow (step 2), with these
# checks:
#
#   * the revision and version labels that the build set from the tag
#   * the keyless signature: one of the allowed signing workflows, on main,
#     in ExtendDB/extenddb, from a workflow_dispatch run. Any public
#     repository can call a public reusable workflow, and the certificate
#     SAN names the called file at the caller's ref, so the repository is
#     checked as well as the identity.
#   * `extenddb version` in the image (linux/amd64) reports the version and
#     the full commit
#
# Every read is anonymous; the caller needs no credential.

name: verify-image
description: Check the labels, keyless signature and `extenddb version` of one image digest on Docker Hub

inputs:
  image:
    description: 'Docker Hub repository under extenddb/, e.g. extenddb-postgres'
    required: true
  digest:
    description: 'Index digest to check (sha256:<64 hex>)'
    required: true
  version:
    description: 'Release version (X.Y.Z, no v prefix)'
    required: true
  commit:
    description: 'Full SHA of the tagged commit'
    required: true
  signer-workflows:
    description: 'Pipe-separated signing-workflow basenames, e.g. release-image|sign-image'
    required: true
  cosign-version:
    description: 'Pinned cosign version (not preinstalled on GitHub runners)'
    default: v3.1.3
  cosign-sha256:
    description: 'SHA-256 of the pinned cosign-linux-amd64 binary'
    default: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71

runs:
  using: composite
  steps:
    - name: Install pinned cosign (checksum-verified; skipped when present)
      shell: bash
      env:
        COSIGN_VERSION: ${{ inputs.cosign-version }}
        COSIGN_SHA256: ${{ inputs.cosign-sha256 }}
      run: |
        set -euo pipefail
        if command -v cosign >/dev/null && [[ "$(cosign version 2>/dev/null | awk '/GitVersion/{print $2}')" == "$COSIGN_VERSION" ]]; then
          exit 0
        fi
        curl -sSfL -o /tmp/cosign \
          "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
        echo "${COSIGN_SHA256}  /tmp/cosign" | sha256sum --check --strict
        sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign
        cosign version

    - name: Verify ${{ inputs.image }} (labels, signature, `extenddb version`)
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ inputs.digest }}
        VERSION: ${{ inputs.version }}
        COMMIT: ${{ inputs.commit }}
        SIGNERS: ${{ inputs.signer-workflows }}
      run: |
        set -euo pipefail
        # The inputs reach the shell only through the environment, and each
        # is checked for shape before it is used in a reference or a regex.
        [[ "$IMAGE" =~ ^extenddb-[a-z]+$ ]] \
          || { echo "::error::image '${IMAGE}' is not an extenddb image name"; exit 1; }
        [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
          || { echo "::error::${IMAGE}: no digest from its release run ('${DIGEST}')"; exit 1; }
        [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
          || { echo "::error::version '${VERSION}' is not MAJOR.MINOR.PATCH"; exit 1; }
        [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] \
          || { echo "::error::commit '${COMMIT}' is not a full SHA"; exit 1; }
        [[ "$SIGNERS" =~ ^[a-z0-9-]+([|][a-z0-9-]+)*$ ]] \
          || { echo "::error::signer-workflows '${SIGNERS}' is not a list of workflow names"; exit 1; }
        REF="docker.io/extenddb/${IMAGE}@${DIGEST}"

        LABELS=$(skopeo inspect --no-creds --override-arch amd64 --override-os linux "docker://${REF}" | jq -c .Labels)
        [[ "$(jq -r '."org.opencontainers.image.revision"' <<< "$LABELS")" == "$COMMIT" ]] \
          || { echo "::error::${IMAGE}: revision label is not ${COMMIT}: ${LABELS}"; exit 1; }
        [[ "$(jq -r '."org.opencontainers.image.version"' <<< "$LABELS")" == "$VERSION" ]] \
          || { echo "::error::${IMAGE}: version label is not ${VERSION}: ${LABELS}"; exit 1; }

        cosign verify \
          --certificate-identity-regexp "^https://github\.com/ExtendDB/extenddb/\.github/workflows/(${SIGNERS})\.yml@refs/heads/main$" \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          --certificate-github-workflow-repository ExtendDB/extenddb \
          --certificate-github-workflow-trigger workflow_dispatch \
          "$REF" > /dev/null \
          || { echo "::error::${IMAGE}: the signature does not verify as (${SIGNERS}).yml on main in ExtendDB/extenddb"; exit 1; }

        OUT=$(docker run --rm --platform linux/amd64 "$REF" version)
        grep -qx "extenddb ${VERSION}" <<< "$OUT" \
          || { echo "::error::${IMAGE}: \`extenddb version\` does not report ${VERSION}: ${OUT}"; exit 1; }
        grep -qx "commit ${COMMIT}" <<< "$OUT" \
          || { echo "::error::${IMAGE}: \`extenddb version\` does not report commit ${COMMIT}: ${OUT}"; exit 1; }

        {
          echo ""
          echo "### ${IMAGE} verified"
          echo ""
          echo "| field | value |"
          echo "|---|---|"
          echo "| image | \`${REF}\` |"
          echo "| labels | revision \`${COMMIT}\`, version \`${VERSION}\` |"
          echo "| signature | ${SIGNERS//|/ or } on main, ExtendDB/extenddb, workflow_dispatch |"
          echo "| \`extenddb version\` | ${VERSION}, commit \`${COMMIT}\` |"
        } >> "$GITHUB_STEP_SUMMARY"
