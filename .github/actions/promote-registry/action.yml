#
# Composite action: promote one verified digest to `X.Y.Z` (and optionally
# `latest`) on ONE destination registry. Single source of truth for the
# per-registry promotion rules:
#
#   * the signature comes FIRST: before any tag is placed, the Cosign
#     signature for the digest must verify against the committed release
#     public key (on the destination, or copied from the source). No tag can
#     ever exist without a verified signature behind it.
#   * version tags are immutable: an existing version tag with a different
#     digest fails; the identical digest is an idempotent no-op
#   * `latest` only moves forward, judged against THE DESTINATION's own tags
#   * every existence probe FAILS CLOSED: a definite "manifest unknown" means
#     absent; any other probe failure aborts the leg rather than being
#     mistaken for absence (a transient error must never look like a green
#     light to copy or to move latest)
#   * every copy is by digest with --preserve-digests and post-copy assertion
#
# The CALLER handles registry authentication and approval gating.

name: promote-registry
description: Promote a verified digest to version (+ guarded latest) on one registry

inputs:
  src-repo:
    description: 'Source repository holding the digest and its signature'
    required: true
  dst-repo:
    description: 'Destination repository'
    required: true
  version:
    description: 'Version to promote to (X.Y.Z, no v prefix); caller validates'
    required: true
  digest:
    description: 'Verified index digest (sha256:<64 hex>); caller validates'
    required: true
  move-latest:
    description: 'Whether this promotion also moves latest (true/false)'
    required: true
  public-key:
    description: 'Path to the release signing public key (PEM)'
    default: extenddb-signing.pub.pem
  cosign-version:
    description: 'Pinned cosign version (NOT preinstalled on GitHub runners)'
    default: v3.1.3
  cosign-sha256:
    description: 'SHA-256 of the pinned cosign-linux-amd64 binary'
    default: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71

runs:
  using: composite
  steps:
    # cosign is NOT in the ubuntu-24.04 runner image (skopeo is), and even
    # if it were, verify semantics are version-sensitive — install pinned.
    - name: Install pinned cosign (checksum-verified; skipped when present)
      shell: bash
      env:
        COSIGN_VERSION: ${{ inputs.cosign-version }}
        COSIGN_SHA256: ${{ inputs.cosign-sha256 }}
      run: |
        set -euo pipefail
        if command -v cosign >/dev/null && [[ "$(cosign version 2>/dev/null | awk '/GitVersion/{print $2}')" == "$COSIGN_VERSION" ]]; then
          exit 0
        fi
        curl -sSfL -o /tmp/cosign \
          "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
        echo "${COSIGN_SHA256}  /tmp/cosign" | sha256sum --check --strict
        sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign
        cosign version

    - name: Promote ${{ inputs.dst-repo }} to ${{ inputs.version }}
      shell: bash
      env:
        SRC: ${{ inputs.src-repo }}
        DST: ${{ inputs.dst-repo }}
        VERSION: ${{ inputs.version }}
        DIGEST: ${{ inputs.digest }}
        MOVE_LATEST: ${{ inputs.move-latest }}
        PUBKEY: ${{ inputs.public-key }}
      run: |
        set -euo pipefail
        SIG_TAG="sha256-${DIGEST#sha256:}.sig"

        # Probe helper: three-way, fails closed. Prints the digest and
        # returns 0 when the tag exists; returns 9 when definitely absent;
        # exits the leg on any other failure.
        probe() {
          local ref="$1" out
          if out=$(skopeo inspect --format '{{.Digest}}' "docker://${ref}" 2>&1); then
            printf '%s' "$out"; return 0
          elif grep -qiE 'manifest unknown|name unknown|not found|unauthorized: repository .* not found' <<< "$out"; then
            return 9
          else
            echo "::error::probe of ${ref} failed (not a definite absence): ${out}" >&2
            exit 1
          fi
        }

        # settle(): post-WRITE assertion with a bounded settle window. ECR
        # Public exhibits read-after-write lag in BOTH directions:
        #   * a newly created tag reads as absent for a few seconds
        #     (failed the v0.1.8 dev propagation), and
        #   * an OVERWRITTEN tag — `latest` moving to a new release — keeps
        #     reading as the PREVIOUS digest for a few seconds (failed the
        #     v0.1.10 dev propagation, after correctly writing every tag).
        # So a mismatch immediately after our own write is not evidence of a
        # wrong artifact; it is the stale value we just replaced. Both cases
        # therefore retry inside the window and only fail once it expires,
        # reporting the last value seen. Retrying is ONLY correct after our
        # own write: state DECISIONS (exists/absent, verify-before-tag) stay
        # strict single probes, so nothing here weakens the fail-closed
        # guarantees.
        settle() {
          local ref="$1" want="$2" got rc last='(never read)'
          for _ in 1 2 3 4 5 6; do
            set +e; got=$(probe "$ref"); rc=$?; set -e
            [[ $rc == 0 && "$got" == "$want" ]] && return 0
            [[ $rc == 0 ]] && last="$got"
            [[ $rc == 9 ]] && last='MISSING'
            sleep 5
          done
          echo "::error::${ref} did not settle on ${want} within the window; last seen ${last}" >&2
          return 1
        }

        # --- 1. signature first: verified before ANY tag is placed ---
        set +e; DST_SIG=$(probe "${DST}:${SIG_TAG}"); rc=$?; set -e
        [[ $rc == 0 || $rc == 9 ]] || exit 1
        if [[ $rc == 9 ]]; then
          set +e; SRC_SIG=$(probe "${SRC}:${SIG_TAG}"); rc2=$?; set -e
          if [[ $rc2 == 9 ]]; then
            echo "::error::no Cosign signature for ${DIGEST} on ${SRC} or ${DST}; refusing to promote an unsigned artifact"
            exit 1
          fi
          [[ $rc2 == 0 ]] || exit 1
          skopeo copy --preserve-digests \
            "docker://${SRC}:${SIG_TAG}" \
            "docker://${DST}:${SIG_TAG}"
          settle "${DST}:${SIG_TAG}" "$SRC_SIG" || { echo "::error::signature missing or mismatched after copy"; exit 1; }
        fi
        # The signature must actually VERIFY, not merely exist: an empty or
        # wrong-key manifest at the .sig tag name must not pass. Verified
        # against the DESTINATION, so all three paths are covered — a sig
        # copied just now, a sig from an earlier run, and whatever else may
        # be sitting at the tag name on DST. ignore-tlog because pre-Rekor
        # releases (<= 0.1.6) have no transparency entries; key verification
        # is unaffected. Tighten when all live releases do.
        cosign verify --key "$PUBKEY" --insecure-ignore-tlog=true "${DST}@${DIGEST}" >/dev/null

        # --- 2. version tag: immutable, idempotent on the identical digest ---
        set +e; EXISTING=$(probe "${DST}:${VERSION}"); rc=$?; set -e
        if [[ $rc == 0 ]]; then
          if [[ "$EXISTING" != "$DIGEST" ]]; then
            echo "::error::${DST}:${VERSION} already exists with different digest ${EXISTING}; released versions are immutable"
            exit 1
          fi
          echo "::notice::${DST}:${VERSION} already promoted with the exact digest"
        elif [[ $rc == 9 ]]; then
          skopeo copy --all --preserve-digests \
            "docker://${SRC}@${DIGEST}" \
            "docker://${DST}:${VERSION}"
        else
          exit 1
        fi

        # --- 3. latest: forward-only against THIS destination's tags ---
        if [[ "$MOVE_LATEST" == "true" ]]; then
          # The network call is fatal on failure; only the PARSE tolerates an
          # empty match. A failed list must never read as "no versions here".
          TAGS_JSON=$(skopeo list-tags "docker://${DST}")
          HIGHEST=$(jq -r '.Tags[]' <<< "$TAGS_JSON" \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -vxF "$VERSION" \
            | sort -V \
            | tail -1 || true)
          if [[ -n "$HIGHEST" ]]; then
            TOP=$(printf '%s\n%s\n' "$VERSION" "$HIGHEST" | sort -V | tail -1)
            if [[ "$TOP" != "$VERSION" ]]; then
              echo "::error::${VERSION} is not the highest version on ${DST} (${HIGHEST} is); refusing to move latest backwards"
              exit 1
            fi
          fi
          skopeo copy --all --preserve-digests \
            "docker://${SRC}@${DIGEST}" \
            "docker://${DST}:latest"
        fi

        # --- 4. verify everything this leg touched ---
        TAGS=("${VERSION}")
        [[ "$MOVE_LATEST" == "true" ]] && TAGS+=(latest)
        for t in "${TAGS[@]}"; do
          settle "${DST}:${t}" "$DIGEST" || exit 1
        done
        echo "::notice::${DST}: promoted ${VERSION}$([[ "$MOVE_LATEST" == "true" ]] && echo ' + latest'), signature verified"
