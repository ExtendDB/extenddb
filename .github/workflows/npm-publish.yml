# Publishes CANDIDATE npm packages for the ExtendDB dev launcher: the five
# @extenddb/<os>-<arch> platform binary packages plus the `@extenddb/dev` launcher
# that selects among them via optionalDependencies.
#
# This workflow deliberately stops at the candidate. Every package is published
# under the `candidate` dist-tag, never `latest`, so nothing a user installs by
# default can come from an unverified run. Promotion is a separate step:
# the npm-latest job of release-publish.yml, after its verify-npm job, or a
# maintainer by hand as packaging/README.md records:
#
#   npm dist-tag add @extenddb/dev@<version> latest   (and one per platform pkg)
#
# With the `dry_run` input the run ends after the build jobs: the gates and
# the five native builds, smoke tests and launcher suites run as for a
# release, and nothing is published; dry runs have a concurrency group of
# their own (release-image.yml).
#
# Shape, and why (mirrors .github/workflows/release-image.yml):
#
#   gate      Runs once. Cheap checks that need no build: the dispatch input is
#             validated as a strict `vX.Y.Z` tag, resolved to a full commit
#             SHA, that SHA must be contained in origin/main, and the version
#             must agree with the workspace version at the tagged commit. A
#             rehearsal of an untagged commit is checked as described below.
#
#             The launcher versions WITH the server, off the same `vX.Y.Z` tag
#             the container release uses, because the five platform packages
#             ship the server binary: a server release necessarily republishes
#             all six, and the launcher pins optionalDependencies to its own
#             version, so an independent number could only ever answer "which
#             launcher" and never the question users actually ask, "which
#             server is inside this". Same convention as esbuild and biome,
#             whose launchers pin their platform packages at the tool version.
#             The cost is accepted: a launcher-only fix rides the next server
#             release rather than shipping under its own number.
#
#   build     One job per platform, each on its NATIVE runner: no emulation and
#             no cross-compilation, so every published binary was genuinely
#             executed. Each job builds the slim dev-mode binary, smoke tests
#             `--version`, then runs the full launcher test suite against the
#             built binary (the same suite that gates the packaging directory),
#             and uploads the binary as an artifact. These jobs hold NO
#             registry credentials.
#
#   publish   Runs once, after all five platforms pass, in the `npm` protected
#             environment. This is the only job with the npm token, so the
#             token never exists in a job that is executing a freshly built
#             binary, and never exists at all unless every platform passed.
#             Publishes with --provenance, binding each package to this
#             workflow run and commit.
#
# Trigger: workflow_dispatch, or workflow_call from another workflow in
# this repository (below). There is intentionally no `push: tags:`
# trigger: a tag-triggered run executes the workflow definition
# from the tagged revision, which may be older than the reviewed workflow on
# protected main. Dispatching from main runs the current definition against an
# existing, validated tag.
#
# Another workflow can call this one (workflow_call) with the same inputs:
# release-rehearsal.yml runs it with dry_run on the release PR's head
# commit, which has no tag yet, by passing the commit input. The gate
# accepts a commit only with dry_run and only if it is on main or is the
# head of the release PR's branch; it then skips the tag checks, and the
# publish jobs never run. A called run executes this file as it is in the
# caller's commit and runs in the caller's repository. Any public
# repository can call this file, and the provenance certificate of a
# package published there would name this file, so the gate's first step
# refuses to run in any repository other than ExtendDB/extenddb.
#
# One-time setup (Settings -> Environments -> npm):
#   Deployment branches: Selected, rule `branch: main`. A dispatch from any
#     other ref cannot read the token at all.
#   Required reviewers: the candidate publish must be approved before it runs.
#   Secrets: none. Authentication is npm trusted publishing (OIDC), so there
#     is no token to store, leak, or rotate. The environment gate is still
#     load-bearing: npm matches the environment name as part of the trust
#     relationship, so a run outside `npm` cannot mint a publish credential.
#
# Plus, once on the registry, per package (all six: @extenddb/dev and the five
# @extenddb/<os>-<arch>): Settings -> Trusted Publisher -> GitHub Actions, with
#   Organization or user: ExtendDB
#   Repository:           extenddb
#   Workflow filename:    npm-publish.yml
#   Environment:          npm
# Every field is matched exactly, the workflow filename included, so renaming
# this file breaks publishing until the six entries are updated. When
# release-publish.yml calls this workflow, npm matches the calling file
# instead, so each package also has an entry with workflow filename
# release-publish.yml, environment npm, and the allowed actions `npm publish`
# and `npm dist-tag`.
#
# npm requires a package to exist before a trusted publisher can be configured,
# so all six were first published as 0.0.0 placeholders under the `placeholder`
# dist-tag from a maintainer machine.

name: npm-publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish npm candidates for, e.g. v0.1.4'
        required: true
      dry_run:
        description: 'Rehearse only: run the gates and the five platform builds with their smoke tests and launcher suites; publish nothing'
        type: boolean
        default: false
      commit:
        description: 'With dry_run only: rehearse this commit (full SHA) before it is tagged. It must be on main or be the head of the release PR. The tag is the one it will get.'
        default: ''
  # release-publish.yml and release-rehearsal.yml call this workflow with
  # the same inputs.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      dry_run:
        type: boolean
        default: false
      commit:
        type: string
        default: ''

# Nothing is committed, so no write scope on the repo is needed. The publish
# job adds id-token at job level, which is what both authenticates to npm
# (trusted publishing) and attests provenance.
permissions:
  contents: read

# Two launcher releases must never race.
concurrency:
  group: npm-publish-extenddb${{ inputs.dry_run && '-dry' || '' }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      # A called workflow runs in the caller's repository, and any public
      # repository can call this one; refuse before any other step.
      - name: Refuse to run outside ExtendDB/extenddb
        run: |
          [[ "$GITHUB_REPOSITORY" == "ExtendDB/extenddb" ]] \
            || { echo "::error::this workflow publishes ExtendDB only; it does not run in ${GITHUB_REPOSITORY}"; exit 1; }

      - name: Check out main (the reviewed workflow's own ref)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0         # tag resolution and the ancestry gate need history

      - name: Gate - the tag must identify released launcher code
        id: meta
        env:
          # Dispatch inputs are untrusted; they reach the shell only through the
          # environment, never by interpolation into the script source.
          RAW_TAG: ${{ inputs.tag }}
          RAW_COMMIT: ${{ inputs.commit }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # 1. Strict shape first: anything else cannot be a launcher release
          #    tag and must not reach git commands as a ref expression.
          if [[ ! "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::input '$RAW_TAG' is not a strict release tag (vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          VERSION="${RAW_TAG#v}"

          if [[ -n "$RAW_COMMIT" ]]; then
            # A rehearsal of a commit that is not tagged yet, such as the
            # release PR's head (release-rehearsal.yml). A dry run publishes
            # nothing, so the tag checks wait until the merge creates the
            # tag; the version checks below still apply.
            [[ "$DRY_RUN" == "true" ]] \
              || { echo "::error::the commit input is accepted only with dry_run"; exit 1; }
            [[ "$RAW_COMMIT" =~ ^[0-9a-f]{40}$ ]] \
              || { echo "::error::commit '${RAW_COMMIT}' is not a full commit SHA"; exit 1; }
            # GitHub serves the head of every PR by SHA, a fork's included.
            # Only a commit on main or the release PR's head may be built
            # here, because a run dispatched from main can write main's
            # Actions cache, which every branch restores.
            git fetch --no-tags origin main
            RELEASE_PR_HEAD=$(git ls-remote origin refs/heads/release-please--branches--main--components--extenddb | cut -f1)
            git fetch --no-tags origin "$RAW_COMMIT" \
              || { echo "::error::commit ${RAW_COMMIT} is not on origin"; exit 1; }
            git merge-base --is-ancestor "$RAW_COMMIT" origin/main \
              || [[ "$RAW_COMMIT" == "$RELEASE_PR_HEAD" ]] \
              || { echo "::error::commit ${RAW_COMMIT} is neither on main nor the head of the release PR"; exit 1; }
            SHA="$RAW_COMMIT"
          else
            # 2. The tag must already exist; this workflow never creates tags.
            git fetch --no-tags origin "refs/tags/${RAW_TAG}:refs/tags/${RAW_TAG}" \
              || { echo "::error::tag ${RAW_TAG} does not exist on origin"; exit 1; }
            SHA=$(git rev-list -n 1 "refs/tags/${RAW_TAG}")
            [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] \
              || { echo "::error::could not resolve ${RAW_TAG} to a full commit SHA"; exit 1; }

            # 3. The tagged commit must be on main, so a tag pushed on an
            #    unmerged branch cannot publish unreviewed code publicly.
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$SHA" origin/main; then
              echo "::error::${RAW_TAG} (${SHA}) is not contained in origin/main"
              exit 1
            fi
          fi

          # 4. The tag must agree with the workspace version, which is the
          #    single source of truth for a release across every distribution
          #    channel (container, npm, and later pip).
          CARGO_VERSION=$(git show "${SHA}:Cargo.toml" \
            | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1)
          if [[ "$VERSION" != "$CARGO_VERSION" ]]; then
            echo "::error::tag ${RAW_TAG} implies ${VERSION} but the workspace version at ${SHA} is ${CARGO_VERSION}"
            exit 1
          fi

          # 5. The launcher manifest must carry the same version, at the
          #    tagged commit and on origin/main.
          #    At the tag: every build leg runs the tagged commit's launcher
          #    suite against the binary it built. The launcher runs only a
          #    binary of its own release. A tagged manifest at another
          #    version fails all five legs after this gate passes. The
          #    release flow cannot fix a tag in place, so refuse the tag
          #    here, before any build.
          #    On origin/main: the publish step rewrites the version anyway,
          #    so a stale value there would not break the release. It would
          #    mislead anyone who reads the manifest.
          TAG_PKG_VERSION=$(git show "${SHA}:packaging/npm/package.json" | jq -r .version)
          if [[ "$VERSION" != "$TAG_PKG_VERSION" ]]; then
            echo "::error::packaging/npm/package.json at ${RAW_TAG} (${SHA}) says ${TAG_PKG_VERSION}, expected ${VERSION}: the launcher suite on every build leg would refuse the ${VERSION} binary (bump the manifest in the same commit as the workspace version, before the tag)"
            exit 1
          fi
          #    A rehearsal of an untagged commit skips the origin/main half:
          #    main gets the version when the release PR merges.
          if [[ -z "$RAW_COMMIT" ]]; then
            PKG_VERSION=$(git show "origin/main:packaging/npm/package.json" | jq -r .version)
            if [[ "$VERSION" != "$PKG_VERSION" ]]; then
              echo "::error::packaging/npm/package.json on origin/main says ${PKG_VERSION}, expected ${VERSION} (bump it with the workspace version)"
              exit 1
            fi
          fi

          {
            echo "version=$VERSION"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the tagged commit for the migration gate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ steps.meta.outputs.sha }}
          persist-credentials: false

      - name: Gate - the release freezes the catalog migrations it ships
        # The platform packages ship the sqlite,dev-mode build of the tag,
        # whose dev server applies SQLite migrations to a catalog behind it.
        # As in release-image.yml: RELEASED_THROUGH must reach the last
        # migration id. A tag before the migration framework passes.
        run: |
          set -euo pipefail
          if [[ -e crates/storage/src/migrations/registry.rs ]]; then
            python3 devtools/check-released-through
          else
            echo "the tagged commit has no catalog migration registry"
          fi

  build:
    needs: gate
    # The matrix lives in npm-build-matrix.yml, shared with the pull-request
    # dry run (npm-build-dryrun.yml) so the release path and the pre-merge
    # proof are the same jobs on the same runner labels. Change the matrix
    # there and the dry run exercises it on real runners before merge.
    uses: ./.github/workflows/npm-build-matrix.yml
    with:
      ref: ${{ needs.gate.outputs.sha }}
      # A release stops at the first failing platform; a rehearsal lets all
      # five report.
      fail-fast: ${{ !inputs.dry_run }}

  # A rehearsal's end: the gates and the builds ran as the release runs them,
  # and nothing was published. The publish-side jobs are skipped by their
  # `if`, so their environments ask no approval.
  dry-run-summary:
    needs: [gate, build]
    if: ${{ inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarise the rehearsal
        run: |
          {
            echo "### Dry run: gates and builds passed, nothing published"
            echo ""
            echo "The five platform binaries built, passed their smoke tests and the launcher suite. Dispatch again without the dry run to publish the candidates."
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| tag | \`v${{ needs.gate.outputs.version }}\` |"
            echo "| commit | \`${{ needs.gate.outputs.sha }}\` |"
            echo "| version (from tag) | \`${{ needs.gate.outputs.version }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [gate, build]
    # The gate refuses a commit without dry_run; this is the second check.
    if: ${{ !inputs.dry_run && inputs.commit == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The protected environment requires reviewer approval, and its name is
    # part of the npm trusted-publisher match, so it gates credential minting
    # rather than merely gating a stored secret.
    environment: npm
    permissions:
      contents: read
      id-token: write            # mints the OIDC token npm exchanges for a
                                 # short-lived publish credential; also what
                                 # --provenance is attested from
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Set up node against the public registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1 for the OIDC exchange, and the
      # Node 22 image bundles npm 10. Without this the publish falls back to
      # looking for a token and fails with ENEEDAUTH. The version is exact,
      # because this job holds a token that can publish all six packages.
      - name: Install the pinned npm
        env:
          NPM_VERSION: 11.21.3
        run: |
          set -euo pipefail
          npm install -g "npm@${NPM_VERSION}"
          [[ "$(npm --version)" == "$NPM_VERSION" ]] \
            || { echo "::error::npm is $(npm --version), not ${NPM_VERSION}"; exit 1; }

      - name: Download the built binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts/
          # Only this workflow's binaries: a caller's run can hold other
          # workflows' artifacts, such as the image tarballs. Each lands in
          # artifacts/bin-<platform>/.
          pattern: bin-*

      # "Re-run failed jobs" after a partial publish runs both loops below
      # from the start. A version that is already on npm with the same
      # tarball is skipped, and one with another tarball fails the job.
      # npm pack makes the same tarball that npm publish uploads, with fixed
      # file times, so the two integrity values compare. A new run builds
      # the binaries again, so its tarballs need not match.
      - name: Write the publish helper
        run: |
          cat > "$RUNNER_TEMP/publish-once.sh" <<'EOF'
          # publish_once DIR NAME: publish DIR as NAME@VERSION under the
          # candidate dist-tag, unless npm already has NAME@VERSION.
          publish_once() {
            local dir=$1 name=$2 packed want got i
            packed=$(npm pack --dry-run --json "$dir")
            [[ "$(jq -r '.[0].id' <<< "$packed")" == "${name}@${VERSION}" ]] \
              || { echo "::error::${dir} packs as $(jq -r '.[0].id' <<< "$packed"), not ${name}@${VERSION}"; return 1; }
            want=$(jq -r '.[0].integrity' <<< "$packed")
            # E404 means npm has no such version. Any other failed read is
            # retried.
            for i in 1 2 3 4 5 6; do
              if got=$(npm view --json "${name}@${VERSION}" dist.integrity); then
                got=$(jq -r . <<< "$got")
                [[ -n "$got" ]] || { echo "::error::npm has ${name}@${VERSION} without dist.integrity"; return 1; }
                break
              fi
              if [[ "$(jq -r '.error.code? // empty' <<< "$got" 2>/dev/null)" == E404 ]]; then
                got=""
                break
              fi
              [[ $i == 6 ]] && { echo "::error::could not read ${name}@${VERSION} from npm"; return 1; }
              echo "Reading ${name}@${VERSION} from npm failed; retrying in 20 seconds"
              sleep 20
            done
            if [[ -z "$got" ]]; then
              echo "Publishing ${name}@${VERSION} (candidate)"
              npm publish --provenance --access public --tag candidate "$dir"
            elif [[ "$got" == "$want" ]]; then
              echo "::notice::${name}@${VERSION} is already on npm with the same contents; not published again"
            else
              echo "::error::${name}@${VERSION} is already on npm with other contents (npm has ${got}, this run packs ${want})"
              return 1
            fi
          }
          EOF

      - name: Publish the five platform packages (candidate dist-tag)
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/publish-once.sh"

          # The platform list is derived from the launcher's
          # optionalDependencies, the single source of truth, so the publish
          # loop cannot drift from what the launcher wires up. The build
          # matrix is asserted against the same list below: a platform in the
          # dependencies but missing from the matrix has no artifact and
          # fails here, loudly, before anything is published.
          PLATFORMS=$(jq -r '.optionalDependencies | keys[] | ltrimstr("@extenddb/")' packaging/npm/package.json)

          for pkg in $PLATFORMS; do
            dir="packaging/npm/platform/${pkg}"
            bin="extenddb"; [[ "$pkg" == win32-* ]] && bin="extenddb.exe"

            [[ -d "$dir" ]] || { echo "::error::no template for ${pkg} (optionalDependencies/platform drift)"; exit 1; }
            [[ -f "artifacts/bin-${pkg}/${bin}" ]] || { echo "::error::no built artifact for ${pkg} (optionalDependencies/build-matrix drift)"; exit 1; }

            # Stage the binary at the package root, where the launcher's
            # require.resolve contract expects it, plus the licence files
            # Apache-2.0 section 4 requires in every distribution. npm
            # includes LICENSE and NOTICE regardless of the files whitelist.
            cp "artifacts/bin-${pkg}/${bin}" "${dir}/${bin}"
            chmod +x "${dir}/${bin}"
            cp LICENSE NOTICE "${dir}/"

            jq --arg v "$VERSION" '.version = $v' "${dir}/package.json" > "${dir}/package.json.tmp"
            mv "${dir}/package.json.tmp" "${dir}/package.json"

            publish_once "${dir}" "@extenddb/${pkg}"
          done

      - name: Publish the launcher package (candidate dist-tag)
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/publish-once.sh"
          cp LICENSE NOTICE packaging/npm/
          cd packaging/npm

          # The launcher and its platform packages are one release: pin the
          # optionalDependencies to exactly this version so npm can never mix
          # a launcher with binaries from a different release.
          jq --arg v "$VERSION" '
            .version = $v
            | .optionalDependencies |= with_entries(.value = $v)
          ' package.json > package.json.tmp
          mv package.json.tmp package.json

          publish_once . @extenddb/dev
