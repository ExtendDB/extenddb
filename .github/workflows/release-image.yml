# Publishes an immutable, commit-addressed CANDIDATE of an ExtendDB backend
# container image to Docker Hub, for linux/amd64 and linux/arm64.
#
# This workflow never creates the version tag or `latest` (promotion is
# promote-image's job, separately approved), but it carries the candidate all
# the way to signed-and-mirrored: publish + sign under the dockerhub
# environment approval, then propagation to GHCR + ECR under the ghcr
# environment approval. Any defect's blast radius stays a tag no user
# consumes.
#
# With the `dry_run` input the run ends after the build jobs: the gates and
# both builds, smoke tests, scans and SBOMs run as for a release, and nothing
# is published, signed or attested. A release rehearsal dispatches the three
# publish workflows (this one per image, release-dev-image, npm-publish) this
# way against the tag first, then again for real. Dry runs have a
# concurrency group of their own, so a dry run never cancels a pending
# release. devtools/release-dry-run runs the same gate and build steps on
# a developer's machine, for the host's architecture.
#
# Shape, and why:
#
#   gate      Runs once. Cheap checks that do not need a build, so a bad input
#             fails in seconds rather than after two image builds. The release
#             tag arrives as a dispatch input, is validated as strict semver,
#             resolved to a full commit SHA, and that SHA must be contained in
#             origin/main and agree with the workspace version.
#
#   build     One job per architecture, each on its NATIVE runner. No emulation,
#             so the arm64 image is genuinely executed rather than published
#             untested. Each job builds with `load: true`, smoke tests the
#             result, saves the image as a workflow artifact, and fails if the
#             saved tarball has a fixable high or critical vulnerability in
#             its operating system packages. It also writes the image SBOM
#             from the same tarball. `docker save`/`load` preserves the image
#             ID, so the artifact is bit-for-bit what was tested. These jobs
#             hold NO registry credentials and no OIDC token.
#
#   publish   Runs once, after both architectures pass. The only job with
#             Docker Hub credentials; the token never coexists with a job
#             executing a freshly built image. Pushes ONLY commit-addressed
#             candidate tags (sha-<full-commit>{,-amd64,-arm64}), verifies the
#             tag ANONYMOUSLY, then signs the index digest (keyless via
#             OIDC, Rekor, tag-based .sig).
#
#   propagate Second approval (ghcr environment): copies image + signature to
#             GHCR and ECR Public via the copy-artifact composite action —
#             idempotent, fail-closed, digest-asserted. GHCR writes are gated
#             by the ghcr environment's own reviewers; the ECR role's OIDC
#             trust covers both protected environments.
#
#   attest    After publish, alongside propagate: GitHub artifact attestations
#             of the build provenance (the index and both architectures) and
#             of each architecture's SBOM. No registry credential and no
#             approval of its own; it runs only first-party pinned actions,
#             because its OIDC token can sign as this workflow.
#
# Trigger: manual workflow_dispatch only. There is intentionally no
# `push: tags:` trigger: a tag-triggered run executes the workflow definition
# from the tagged revision, which may be older than the reviewed workflow on
# protected main. Dispatching from main runs the current definition against an
# existing, validated tag.
#
# One-time setup (Settings -> Environments -> dockerhub):
#   Deployment branches: Selected, rule `branch: main` (migrated from the old
#     `tag: v*` rule when the tag trigger was removed). A dispatch from any
#     other ref cannot read the token at all.
#   Required reviewers: the candidate push must be approved before it happens.
#   Secrets: none. The Docker Hub credential is read at run time from AWS
#     Secrets Manager (extenddb/dockerhub-publish) through the OIDC role
#     ExtendDBDockerHubPublisher, authorized by the dockerhub environment's
#     sub claim. No Docker Hub token is stored in GitHub.
#
# The backend is a dispatch choice rather than a matrix: a partial failure
# must not publish one backend's candidate and not the other under the same
# release.

name: release-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build a candidate for, e.g. v0.1.3'
        required: true
      image:
        description: 'Which backend image to build'
        type: choice
        options:
          - extenddb-postgres
          - extenddb-mongodb
          - extenddb-cassandra
        default: extenddb-postgres
      dry_run:
        description: 'Rehearse only: run the gates and both builds with their smoke tests, scans and SBOMs; publish, sign, mirror and attest nothing'
        type: boolean
        default: false

# Nothing is committed, so no write scope on the repo is needed.
permissions:
  contents: read

# Two releases must never race. The group names the image, so a future second
# backend does not serialise behind this one for no reason.
concurrency:
  group: release-image-${{ inputs.image }}${{ inputs.dry_run && '-dry' || '' }}
  cancel-in-progress: false

env:
  # Pinned AWS CLI for runners that lack it (the smoke test needs `aws`).
  # Checksums are for awscli-exe-linux-<arch>-2.31.6.zip, recorded when the pin
  # was reviewed; bump the version and both checksums together.
  AWSCLI_VERSION: 2.31.6
  AWSCLI_SHA256_X86_64: 45fdcc3003056b3e85c23776636e74208dc2fc16f26278acdbe8eafe3d4e752b
  AWSCLI_SHA256_AARCH64: 517dec4ce83fabe7ace6164bb6189cdb686ef816332ccf83e81999e3fb57cad5

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
      build_date: ${{ steps.meta.outputs.build_date }}
      image: ${{ steps.meta.outputs.image }}
      image_repo: ${{ steps.meta.outputs.image_repo }}
      dockerfile: ${{ steps.meta.outputs.dockerfile }}
      license_backend: ${{ steps.meta.outputs.license_backend }}
      smoke_script: ${{ steps.meta.outputs.smoke_script }}
      smoke_env: ${{ steps.meta.outputs.smoke_env }}
    steps:
      - name: Check out main (the reviewed workflow's own ref)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0         # tag resolution and the ancestry gate need history

      - name: Gate - the tag must identify released code
        id: meta
        env:
          # Dispatch inputs are untrusted; they reach the shell only through the
          # environment, never by interpolation into the script source.
          RAW_TAG: ${{ inputs.tag }}
          RAW_IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail

          # 1. Strict shape first: anything else cannot be a release tag and
          #    must not reach git commands as a ref expression.
          if [[ ! "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::input '$RAW_TAG' is not a strict semantic version tag (vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          VERSION="${RAW_TAG#v}"

          case "$RAW_IMAGE" in
            extenddb-postgres)
              IMAGE_REPO='extenddb/extenddb-postgres'
              DOCKERFILE='Dockerfile'
              LICENSE_BACKEND='postgres'
              SMOKE_SCRIPT='./ci/smoke-test-container.sh'
              SMOKE_ENV='EXTENDDB_IMAGE'
              ;;
            extenddb-mongodb)
              IMAGE_REPO='extenddb/extenddb-mongodb'
              DOCKERFILE='Dockerfile.mongodb'
              LICENSE_BACKEND='mongodb'
              SMOKE_SCRIPT='./ci/smoke-test-mongodb-container.sh'
              SMOKE_ENV='EXTENDDB_MONGODB_IMAGE'
              ;;
            extenddb-cassandra)
              IMAGE_REPO='extenddb/extenddb-cassandra'
              DOCKERFILE='Dockerfile.cassandra'
              LICENSE_BACKEND='cassandra'
              SMOKE_SCRIPT='./ci/smoke-test-cassandra-container.sh'
              SMOKE_ENV='EXTENDDB_CASSANDRA_IMAGE'
              ;;
            *)
              echo "::error::image '$RAW_IMAGE' is not in the allowlist"
              exit 1
              ;;
          esac

          # 2. The tag must already exist; this workflow never creates tags.
          git fetch --no-tags origin "refs/tags/${RAW_TAG}:refs/tags/${RAW_TAG}" \
            || { echo "::error::tag ${RAW_TAG} does not exist on origin"; exit 1; }
          SHA=$(git rev-list -n 1 "refs/tags/${RAW_TAG}")
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::could not resolve ${RAW_TAG} to a full commit SHA"; exit 1; }

          # 3. The tagged commit must be on main, so a tag pushed on an
          #    unmerged branch cannot publish unreviewed code publicly.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::${RAW_TAG} (${SHA}) is not contained in origin/main"
            exit 1
          fi

          # 4. The tag and the workspace version at that commit must agree.
          CARGO_VERSION=$(git show "${SHA}:Cargo.toml" | grep -m1 '^version' | sed 's/.*"\(.*\)".*/\1/')
          if [[ "$VERSION" != "$CARGO_VERSION" ]]; then
            echo "::error::tag ${RAW_TAG} implies ${VERSION} but Cargo.toml at ${SHA} says ${CARGO_VERSION}"
            exit 1
          fi

          # 5. Deterministic metadata: the build date is the tagged commit's
          #    own timestamp, so the image label and the binary's build time
          #    are the same in every run of the release.
          BUILD_DATE=$(TZ=UTC git show -s --date=format-local:'%Y-%m-%dT%H:%M:%SZ' --format=%cd "$SHA")

          {
            echo "version=$VERSION"
            echo "sha=$SHA"
            echo "build_date=$BUILD_DATE"
            echo "image=$RAW_IMAGE"
            echo "image_repo=$IMAGE_REPO"
            echo "dockerfile=$DOCKERFILE"
            echo "license_backend=$LICENSE_BACKEND"
            echo "smoke_script=$SMOKE_SCRIPT"
            echo "smoke_env=$SMOKE_ENV"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the tagged commit for the licence gate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ steps.meta.outputs.sha }}

      - name: Gate - licence notices must match Cargo.lock
        # A stale SOFTWARE-LICENSE-NOTICES.html matters far more in a
        # distributed image than in source. The script pins cargo-about itself
        # and refuses to run against any other version.
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DOCKERFILE: ${{ steps.meta.outputs.dockerfile }}
          SMOKE_SCRIPT: ${{ steps.meta.outputs.smoke_script }}
          LICENSE_BACKEND: ${{ steps.meta.outputs.license_backend }}
        run: |
          set -euo pipefail
          # A tag cut before an image's container support merged has no
          # Dockerfile or smoke test for it; say so before a build is paid for.
          # (Dockerfile.mongodb and the generator's --backend flag arrived
          # together, so this also covers the earlier MongoDB-specific check.)
          for f in "$DOCKERFILE" "$SMOKE_SCRIPT"; do
            if [[ ! -f "$f" ]]; then
              echo "::error::tagged commit has no ${f}; use a tag created after ${IMAGE} container support was merged"
              exit 1
            fi
          done
          cargo install --locked --version 0.9.0 --features cli cargo-about
          ./devtools/generate-software-license-notices --check \
            --backend "$LICENSE_BACKEND"

      - name: Gate - the release freezes the catalog migrations it ships
        # RELEASED_THROUGH must reach the last migration id, so each
        # backend's checksum test pins every body this tag ships. A tag
        # before the migration framework has no registry and passes.
        run: |
          set -euo pipefail
          if [[ -e crates/storage/src/migrations/registry.rs ]]; then
            python3 devtools/check-released-through
          else
            echo "the tagged commit has no catalog migration registry"
          fi

  build:
    needs: gate
    # If one architecture fails, cancel the other: nothing is published either
    # way, so there is no point paying for the rest of the matrix.
    strategy:
      # A release stops at the first failing architecture; a rehearsal lets
      # both report.
      fail-fast: ${{ !inputs.dry_run }}
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm      # native arm64, no qemu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60          # a hung Rust build must not burn the 6h default
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Ensure smoke-test prerequisites
        # ci/smoke-test-container.sh requires docker, aws and python3. The AWS
        # CLI is not guaranteed on every runner image. Install is pinned to an
        # exact version and verified against a recorded checksum: never execute
        # a mutable unverified download.
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then
            case "$(uname -m)" in
              x86_64)  EXPECTED="$AWSCLI_SHA256_X86_64";  PKG="awscli-exe-linux-x86_64-${AWSCLI_VERSION}.zip" ;;
              aarch64) EXPECTED="$AWSCLI_SHA256_AARCH64"; PKG="awscli-exe-linux-aarch64-${AWSCLI_VERSION}.zip" ;;
              *) echo "::error::unsupported architecture $(uname -m)"; exit 1 ;;
            esac
            curl -fsSL "https://awscli.amazonaws.com/${PKG}" -o /tmp/awscli.zip
            echo "${EXPECTED}  /tmp/awscli.zip" | sha256sum -c - \
              || { echo "::error::AWS CLI download failed checksum verification"; exit 1; }
            unzip -q /tmp/awscli.zip -d /tmp
            sudo /tmp/aws/install
          fi
          for c in docker aws python3; do
            command -v "$c" >/dev/null || { echo "::error::missing $c"; exit 1; }
          done
          docker compose version

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Build the candidate image for ${{ matrix.platform }}, not pushed
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: ${{ needs.gate.outputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          load: true             # into the local store, so it can be tested first
          push: false
          tags: ${{ needs.gate.outputs.image_repo }}:sha-${{ needs.gate.outputs.sha }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.gate.outputs.version }}
            VCS_REF=${{ needs.gate.outputs.sha }}
            BUILD_DATE=${{ needs.gate.outputs.build_date }}
          # No gha build cache, as in release-dev-image.yml. The image built
          # here is the one that is scanned, pushed and signed, so a layer
          # restored from the Actions cache would ship in a signed release
          # (actions/cache-poisoning/poisonable-step). The cache did little
          # for release builds: the cargo build layer's inputs change with
          # every release, so it was restored only when the same release was
          # built a second time, and exporting the cache took up to two and
          # a half minutes per build.

      - name: Confirm the image really is ${{ matrix.arch }}
        # Cheap guard against a silent platform fallback: a mislabelled image
        # would otherwise be published and only fail on a user's machine.
        run: |
          set -euo pipefail
          ACTUAL=$(docker image inspect \
            '${{ needs.gate.outputs.image_repo }}:sha-${{ needs.gate.outputs.sha }}-${{ matrix.arch }}' \
            --format '{{.Architecture}}')
          [[ "$ACTUAL" == "${{ matrix.arch }}" ]] \
            || { echo "::error::expected ${{ matrix.arch }}, image reports $ACTUAL"; exit 1; }

      - name: Smoke test the built image
        # Each image has its own smoke script and its own image variable (the
        # gate picks both). Setting the variable puts the script into prebuilt
        # mode: it reads VERSION / VCS_REF / BUILD_DATE back off the image
        # labels, runs `compose up --no-build`, and asserts every container is
        # running this exact image ID.
        env:
          IMAGE: ${{ needs.gate.outputs.image_repo }}:sha-${{ needs.gate.outputs.sha }}-${{ matrix.arch }}
          SMOKE_ENV: ${{ needs.gate.outputs.smoke_env }}
          SMOKE_SCRIPT: ${{ needs.gate.outputs.smoke_script }}
        run: |
          set -euo pipefail
          case "$SMOKE_ENV" in
            EXTENDDB_IMAGE)           EXTENDDB_IMAGE="$IMAGE" "$SMOKE_SCRIPT" ;;
            EXTENDDB_MONGODB_IMAGE)   EXTENDDB_MONGODB_IMAGE="$IMAGE" "$SMOKE_SCRIPT" ;;
            EXTENDDB_CASSANDRA_IMAGE) EXTENDDB_CASSANDRA_IMAGE="$IMAGE" "$SMOKE_SCRIPT" ;;
            *) echo "::error::unknown smoke-test variable '$SMOKE_ENV'"; exit 1 ;;
          esac

      - name: Save the tested image as an artifact
        # docker save preserves the image ID, so what publish pushes is exactly
        # what passed the smoke test above.
        run: |
          set -euo pipefail
          docker save '${{ needs.gate.outputs.image_repo }}:sha-${{ needs.gate.outputs.sha }}-${{ matrix.arch }}' \
            | gzip > "image-${{ matrix.arch }}.tar.gz"
          ls -lh "image-${{ matrix.arch }}.tar.gz"

      - name: Fail on fixable high or critical vulnerabilities
        # Scans the saved tarball, so the result describes the bytes publish
        # pushes, and the scanner gets no Docker socket. --ignore-unfixed: a
        # finding with no fixed package version cannot be cleared by a rebuild.
        # --skip-files keeps the extenddb binary out of the gate, where it was
        # before cargo-auditable made its crate list visible to the scanner.
        # That list comes from Cargo's resolution and can name crates the
        # binary does not link, so gating on it could block a release over an
        # unlinked crate. The SBOM lists it; gating on it is a separate decision.
        env:
          TRIVY_IMAGE: public.ecr.aws/aquasecurity/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/image-${{ matrix.arch }}.tar.gz:/image.tar.gz:ro" \
            "$TRIVY_IMAGE" image --input /image.tar.gz \
            --scanners vuln --skip-files usr/local/bin/extenddb \
            --ignore-unfixed --severity HIGH,CRITICAL \
            --db-repository public.ecr.aws/aquasecurity/trivy-db:2 \
            --exit-code 1 --no-progress

      - name: Generate the SBOM from the saved tarball
        # Same pinned scanner and the same tarball as the gate above, so the
        # SBOM describes the bytes publish pushes: the OS packages and, through
        # cargo-auditable, the crates Cargo resolved for the binary. It is made
        # here, in a job with no credential and no OIDC token, and attested by
        # the attest job. The scanner records the image ID (the config digest,
        # computed from the tarball) in the SBOM, which lets that job confirm
        # the registry holds this exact image before it attests anything.
        # Crates are required only when the tagged commit's Dockerfile builds
        # with cargo-auditable; a tag cut before that has an OS-only SBOM.
        env:
          TRIVY_IMAGE: public.ecr.aws/aquasecurity/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
          ARCH: ${{ matrix.arch }}
          DOCKERFILE: ${{ needs.gate.outputs.dockerfile }}
        run: |
          set -euo pipefail
          mkdir -p sbom
          # The SBOM goes to stdout (logs go to stderr), so the scanner needs
          # no writable mount.
          docker run --rm \
            -v "$PWD/image-${ARCH}.tar.gz:/image.tar.gz:ro" \
            "$TRIVY_IMAGE" image --input /image.tar.gz \
            --format cyclonedx --no-progress --skip-version-check \
            > "sbom/sbom-${ARCH}.cdx.json"
          # The check is devtools/check-image-sbom at the tagged commit, shared
          # with devtools/release-dry-run; a tag from before it has none.
          [[ -x devtools/check-image-sbom ]] \
            || { echo "::error::tagged commit has no devtools/check-image-sbom; use a tag created after it was merged"; exit 1; }
          devtools/check-image-sbom "sbom/sbom-${ARCH}.cdx.json" "$DOCKERFILE"

      - name: Upload the SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom-${{ matrix.arch }}
          path: sbom/
          retention-days: 7      # a failed attest job can be re-run for a week

      - name: Upload the image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: image-${{ matrix.arch }}
          path: image-${{ matrix.arch }}.tar.gz
          retention-days: 1
          compression-level: 0   # already gzipped

  # A rehearsal's end: the gates and the builds ran as the release runs them,
  # and nothing was published. The publish-side jobs are skipped by their
  # `if`, so their environments ask no approval.
  dry-run-summary:
    needs: [gate, build]
    if: ${{ inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarise the rehearsal
        run: |
          {
            echo "### Dry run: gates and builds passed, nothing published"
            echo ""
            echo "Both architectures of \`${{ needs.gate.outputs.image_repo }}\` built, passed the smoke test and the vulnerability scan, and produced SBOMs. Dispatch again without the dry run to publish the candidate."
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| tag | \`v${{ needs.gate.outputs.version }}\` |"
            echo "| commit | \`${{ needs.gate.outputs.sha }}\` |"
            echo "| version (from tag) | \`${{ needs.gate.outputs.version }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-candidate:
    needs: [gate, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dockerhub       # approval 1: publish + sign (the only job with Docker Hub secrets)
    env:
      IMAGE_REPO: ${{ needs.gate.outputs.image_repo }}
    # Signing rides the publish approval (release owner decision 2026-08-18);
    # propagation is the next job, under the ghcr environment's own gate.
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      candidate: ${{ steps.push.outputs.candidate }}
      sig-tag: ${{ steps.sign.outputs.sig-tag }}
      sig-digest: ${{ steps.sign.outputs.sig-digest }}
    permissions:
      contents: read
      id-token: write   # keyless signing (Sigstore/Fulcio) via OIDC
    steps:
      - name: Check out (composite signing action lives in-repo)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download the tested images
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: images
          pattern: image-*
          merge-multiple: true

      - name: Load both images
        run: |
          set -euo pipefail
          for f in images/image-*.tar.gz; do gunzip -c "$f" | docker load; done
          docker image ls '${{ needs.gate.outputs.image_repo }}'

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Fetch the Docker Hub credential via OIDC (Secrets Manager)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::975306274793:role/ExtendDBDockerHubPublisher
          role-session-name: extenddb-dockerhub-release-${{ github.run_id }}
          aws-region: us-east-1
      - name: Read the Docker Hub credential from Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          secret-ids: DOCKERHUB,extenddb/dockerhub-publish
          parse-json-secrets: true

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Push the commit-addressed candidate only
        id: push
        env:
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          REPO='${{ env.IMAGE_REPO }}'
          CANDIDATE="sha-${SHA}"

          # Idempotent no-overwrite: if the candidate tag exists and holds
          # EXACTLY what this run built, fall through to sign and propagate,
          # so a run that failed after pushing can still be finished.
          # Identity is compared by per-arch image config digest (the image
          # ID, which docker save/load preserves and the smoke test
          # certified) with NO registry mutation: a different artifact
          # errors before anything is pushed. The build has no layer cache,
          # so a new dispatch builds images with different IDs and, if the
          # earlier run pushed the candidate, stops here. To finish a failed
          # run, use "Re-run failed jobs" on that run while its image
          # artifacts are kept (retention-days: 1 above); this job then
          # reloads the images it pushed and they match. Once the artifacts
          # have expired the run cannot be finished this way; sign-image.yml
          # covers signing a candidate that was pushed but not signed.
          if EXISTING=$(docker buildx imagetools inspect "${REPO}:${CANDIDATE}" --format '{{.Manifest.Digest}}' 2>/dev/null); then
            RAW=$(skopeo inspect --no-creds --raw "docker://${REPO}@${EXISTING}")
            MATCH=true
            for arch in amd64 arm64; do
              MDIGEST=$(jq -r --arg a "$arch" '.manifests[] | select(.platform.architecture == $a) | .digest' <<< "$RAW")
              [[ -n "$MDIGEST" && "$MDIGEST" != "null" ]] || { MATCH=false; break; }
              REMOTE_ID=$(skopeo inspect --no-creds --raw "docker://${REPO}@${MDIGEST}" | jq -r '.config.digest')
              LOCAL_ID=$(docker image inspect "${REPO}:${CANDIDATE}-${arch}" --format '{{.Id}}')
              [[ "$REMOTE_ID" == "$LOCAL_ID" ]] || { MATCH=false; break; }
            done
            if [[ "$MATCH" != "true" ]]; then
              echo "::error::candidate ${REPO}:${CANDIDATE} exists (${EXISTING}) but does not match the images this run built and tested; refusing to overwrite"
              exit 1
            fi
            echo "::notice::candidate already published with the identical artifact; continuing to sign/propagate"
            DIGEST="$EXISTING"
          else
            # Per-arch tags first: a manifest list can only reference images
            # that already exist in the registry.
            docker push "${REPO}:${CANDIDATE}-amd64"
            docker push "${REPO}:${CANDIDATE}-arm64"
            docker buildx imagetools create -t "${REPO}:${CANDIDATE}" \
              "${REPO}:${CANDIDATE}-amd64" "${REPO}:${CANDIDATE}-arm64"
            DIGEST=$(docker buildx imagetools inspect "${REPO}:${CANDIDATE}" \
                       --format '{{.Manifest.Digest}}')
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "candidate=${CANDIDATE}" >> "$GITHUB_OUTPUT"

      - name: Verify both architectures are in the published candidate
        run: |
          set -euo pipefail
          OUT=$(docker buildx imagetools inspect \
                  '${{ env.IMAGE_REPO }}:${{ steps.push.outputs.candidate }}')
          echo "$OUT"
          echo "$OUT" | grep -q 'linux/amd64' || { echo "::error::amd64 missing"; exit 1; }
          echo "$OUT" | grep -q 'linux/arm64' || { echo "::error::arm64 missing"; exit 1; }

      - name: Verify the candidate anonymously (the TAG, with no credential)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          CANDIDATE: ${{ steps.push.outputs.candidate }}
        run: |
          set -euo pipefail
          # --no-creds: skopeo otherwise reads the docker login from
          # ~/.docker/config.json, which would make this a maintainer-
          # credentialed fetch. And the check must be TAG-addressed: a
          # digest-addressed inspect is content-addressed and proves nothing
          # about what the tag serves to users.
          GOT=$(skopeo inspect --no-creds --format '{{.Digest}}' "docker://${IMAGE_REPO}:${CANDIDATE}")
          [[ "$GOT" == "$DIGEST" ]] || { echo "::error::${IMAGE_REPO}:${CANDIDATE} anonymously resolves to ${GOT}, expected ${DIGEST}"; exit 1; }
          RAW=$(skopeo inspect --no-creds --raw "docker://${IMAGE_REPO}:${CANDIDATE}")
          grep -q '"architecture": *"amd64"' <<< "$RAW" || { echo "::error::amd64 missing from published index"; exit 1; }
          grep -q '"architecture": *"arm64"' <<< "$RAW" || { echo "::error::arm64 missing from published index"; exit 1; }

      - name: Sign the candidate (composite action; keyless, Rekor ON, tag-based .sig)
        id: sign
        uses: ./.github/actions/sign-image
        with:
          image-repo: ${{ needs.gate.outputs.image_repo }}
          digest: ${{ steps.push.outputs.digest }}
          release-tag: v${{ needs.gate.outputs.version }}

      # Docker Hub lists repositories by last push, newest first, so the pushes
      # above moved this image to the top. ci/dockerhub-order.py puts the list
      # back in its fixed order by pushing existing manifests again: no tag
      # changes digest. A failure here only warns.
      - name: Restore the Docker Hub listing order
        continue-on-error: true
        run: python3 ci/dockerhub-order.py --apply --warn-only

      - name: Summarise for the release checklist
        if: always()
        run: |
          {
            echo "### Candidate published (NOT promoted)"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| candidate | \`${{ needs.gate.outputs.image_repo }}:${{ steps.push.outputs.candidate }}\` |"
            echo "| index digest | \`${{ steps.push.outputs.digest }}\` |"
            echo "| platforms | linux/amd64, linux/arm64 |"
            echo "| version (from tag) | \`${{ needs.gate.outputs.version }}\` |"
            echo "| commit | \`${{ needs.gate.outputs.sha }}\` |"
            echo "| build date (commit-derived) | \`${{ needs.gate.outputs.build_date }}\` |"
            echo "| signature | \`${{ steps.sign.outputs.sig-tag }}\` (Rekor logged) |"
            echo ""
            echo "Published and signed on Docker Hub. Next: the propagate job"
            echo "(ghcr environment approval) copies image + signature to GHCR"
            echo "and ECR; after that, dispatch promote-image with this digest"
            echo "to create the version tag and \`latest\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # Approval 2 (ghcr environment): propagate image + signature to the mirror
  # registries, only after publish + sign completed. GHCR writes are gated by
  # the ghcr environment's own reviewers; the ECR role's OIDC trust covers
  # both protected environments. All copies go through the copy-artifact
  # composite action: idempotent, fail-closed probes, digest-asserted.
  propagate:
    needs: [gate, publish-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ghcr
    permissions:
      contents: read
      packages: write   # GHCR
      id-token: write   # ECR (OIDC role)
    env:
      IMAGE_REPO: ${{ needs.gate.outputs.image_repo }}
      GHCR_REPO: ghcr.io/extenddb/${{ needs.gate.outputs.image }}
      ECR_REPO: public.ecr.aws/extenddb/${{ needs.gate.outputs.image }}
      DIGEST: ${{ needs.publish-candidate.outputs.digest }}
      CANDIDATE: ${{ needs.publish-candidate.outputs.candidate }}
      SIG_TAG: ${{ needs.publish-candidate.outputs.sig-tag }}
      SIG_DIGEST: ${{ needs.publish-candidate.outputs.sig-digest }}
    steps:
      - name: Check out (composite action lives in-repo)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Constant username: GHCR ignores it with a GitHub token, and it
        # keeps the operator identity out of the run block.
        run: |
          set -euo pipefail
          skopeo login ghcr.io -u x-access-token --password-stdin <<< "$GHCR_TOKEN"

      - name: Copy image to GHCR (by digest)
        uses: ./.github/actions/copy-artifact
        with:
          src-repo: ${{ env.IMAGE_REPO }}
          dst-repo: ${{ env.GHCR_REPO }}
          tag: ${{ env.CANDIDATE }}
          digest: ${{ env.DIGEST }}
          by-digest: 'true'

      - name: Copy signature to GHCR (tag-addressed)
        uses: ./.github/actions/copy-artifact
        with:
          src-repo: ${{ env.IMAGE_REPO }}
          dst-repo: ${{ env.GHCR_REPO }}
          tag: ${{ env.SIG_TAG }}
          digest: ${{ env.SIG_DIGEST }}
          by-digest: 'false'

      - name: Assume the ECR publisher role via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::975306274793:role/ExtendDBEcrPublicGitHubPublisher
          role-session-name: extenddb-release-propagate-${{ github.run_id }}
          aws-region: us-east-1

      - name: Log in to ECR Public
        run: |
          set -euo pipefail
          aws ecr-public get-login-password --region us-east-1 \
            | skopeo login public.ecr.aws -u AWS --password-stdin

      - name: Copy image to ECR Public (by digest)
        uses: ./.github/actions/copy-artifact
        with:
          src-repo: ${{ env.IMAGE_REPO }}
          dst-repo: ${{ env.ECR_REPO }}
          tag: ${{ env.CANDIDATE }}
          digest: ${{ env.DIGEST }}
          by-digest: 'true'

      - name: Copy signature to ECR Public (tag-addressed)
        uses: ./.github/actions/copy-artifact
        with:
          src-repo: ${{ env.IMAGE_REPO }}
          dst-repo: ${{ env.ECR_REPO }}
          tag: ${{ env.SIG_TAG }}
          digest: ${{ env.SIG_DIGEST }}
          by-digest: 'false'

      - name: Log out of the mirror registries
        if: always()
        run: |
          skopeo logout ghcr.io || true
          skopeo logout public.ecr.aws || true

  # Build provenance and the SBOMs, as GitHub artifact attestations
  # (Sigstore-signed, stored in this repository's attestation API) bound to the
  # published digests. GitHub generates the provenance from this run's OIDC
  # identity: the workflow, the ref, the commit of main it ran from, and the
  # run. The commit it BUILT is the image's org.opencontainers.image.revision
  # label, which the digest covers. These are GitHub attestations rather than
  # BuildKit's: BuildKit's cannot be loaded into the classic docker image store
  # that `load: true` uses on these runners.
  #
  # A separate job, so it never holds the Docker Hub credential. Its OIDC token
  # can sign as this workflow, so it runs only first-party pinned actions and
  # the runner's skopeo and jq; the SBOM is generated in build, not here. If it
  # fails, re-run it from the same run: the SBOM artifacts are kept 7 days.
  attest:
    needs: [gate, publish-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write       # Sigstore certificate for the attestations
      attestations: write   # store them in this repository's attestation API
    env:
      SUBJECT: docker.io/${{ needs.gate.outputs.image_repo }}
      DIGEST: ${{ needs.publish-candidate.outputs.digest }}
    steps:
      - name: Download the SBOMs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: sbom
          pattern: sbom-*
          merge-multiple: true

      - name: Resolve the subjects; refuse images this run did not build
        id: subjects
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::publish digest is malformed: ${DIGEST}"; exit 1; }
          # The runner's skopeo (1.13 on ubuntu-24.04) does not check that
          # `inspect --raw` bytes hash to the requested digest, so every read
          # is checked here before any field in it is trusted. The index digest
          # then pins both per-arch manifests, and each pins its image ID.
          fetch() {
            skopeo inspect --no-creds --retry-times 3 --raw "docker://${SUBJECT}@$1" > "$2"
            echo "${1#sha256:}  $2" | sha256sum --check --quiet --strict - \
              || { echo "::error::registry bytes for ${SUBJECT}@$1 do not match that digest"; exit 1; }
          }
          fetch "$DIGEST" index.json
          # Exactly the two images this run built: an extra entry would put a
          # platform this run never built under the index's provenance.
          jq -e '(.manifests | length) == 2' index.json > /dev/null \
            || { echo "::error::${SUBJECT}@${DIGEST} lists images other than the two this run built"; exit 1; }
          printf '%s %s\n' "${DIGEST#sha256:}" "$SUBJECT" > subjects.txt
          SBOM_OK=true
          for arch in amd64 arm64; do
            MD=$(jq -r --arg a "$arch" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a) | .digest] | if length == 1 then .[0] else "" end' index.json)
            [[ "$MD" =~ ^sha256:[0-9a-f]{64}$ ]] \
              || { echo "::error::expected exactly one linux/${arch} manifest in ${SUBJECT}@${DIGEST}"; exit 1; }
            fetch "$MD" "manifest-${arch}.json"
            REMOTE_ID=$(jq -r '.config.digest' "manifest-${arch}.json")
            LOCAL_ID=$(jq -r '[.metadata.component.properties[] | select(.name == "aquasecurity:trivy:ImageID") | .value] | if length == 1 then .[0] else "" end' "sbom/sbom-${arch}.cdx.json")
            if [[ ! "$LOCAL_ID" =~ ^sha256:[0-9a-f]{64}$ || "$REMOTE_ID" != "$LOCAL_ID" ]]; then
              echo "::error::linux/${arch} ${MD} is image ${REMOTE_ID}, not ${LOCAL_ID} which this run built and described; refusing to attest"
              exit 1
            fi
            jq -e '[.components[]? | select((.purl // "") | startswith("pkg:cargo/"))] | length > 0' \
              "sbom/sbom-${arch}.cdx.json" > /dev/null || SBOM_OK=false
            printf '%s %s\n' "${MD#sha256:}" "$SUBJECT" >> subjects.txt
            echo "${arch}=${MD}" >> "$GITHUB_OUTPUT"
          done
          cat subjects.txt
          # An SBOM without the binary's crates (a tag cut before
          # cargo-auditable) would understate the image, so it is not attested.
          echo "sbom=${SBOM_OK}" >> "$GITHUB_OUTPUT"
          [[ "$SBOM_OK" == "true" ]] || echo "::warning::no crate list in the SBOMs; attesting provenance only"

      - name: Attest the build provenance (the index and both architectures)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-checksums: subjects.txt

      - name: Attest the linux/amd64 SBOM
        if: steps.subjects.outputs.sbom == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ env.SUBJECT }}
          subject-digest: ${{ steps.subjects.outputs.amd64 }}
          sbom-path: sbom/sbom-amd64.cdx.json

      - name: Attest the linux/arm64 SBOM
        if: steps.subjects.outputs.sbom == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ env.SUBJECT }}
          subject-digest: ${{ steps.subjects.outputs.arm64 }}
          sbom-path: sbom/sbom-arm64.cdx.json

# Deliberate omissions, and what closing them would cost.
#
# No version tag or `latest`: promotion is promote-image's job — a separate
# human decision (soak time), one approved dispatch, all three registries.
#
# Neither the smoke test nor the licence check runs on pull requests. This
# gates releases, not merges.
