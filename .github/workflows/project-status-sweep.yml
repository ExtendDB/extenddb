name: Project status sweep
# Sets Status on the ExtendDB Roadmap board (org Project 3) from the real
# state of each open issue and PR. Runs about every 5 minutes (GitHub may
# delay scheduled runs), right away when an issue is assigned or unassigned,
# and on demand. The rules are in .github/scripts/project-status-sweep.js.
#
# Why a sweep and not PR events: every trigger here runs from the default
# branch, so no fork can start it, and it needs no pull_request_target (which
# GitHub turns off by default for public repos from 2026-12-02).
#
# Health: the sweep rewrites a "Board sweep: ..." draft card on the board each
# run. The report job opens one issue when a run is failed or degraded,
# updates it while the problem lasts, and closes it on the next clean run.
#
# Setup (repo admin, once):
#   1. GitHub App owned by ExtendDB with Organization: Projects read/write;
#      Repository: Issues, Pull requests, Metadata read. No webhook. Install it
#      on every repo whose issues or PRs are on the board (today: extenddb).
#   2. Environment "project-board", deployment branches: main only.
#      In it: variable PROJECT_APP_CLIENT_ID and secret PROJECT_APP_PRIVATE_KEY.
#   3. Board workflows: keep "Item closed" and "Pull request merged" (they set
#      Done). Turn off every other workflow that sets Status; the sweep warns
#      while any is on.
#   4. Optional: single-select board field "Auto status" with option "Off".
#      Cards set to Off are never moved.
#   5. Run this workflow once with dry_run and read the log.
#   6. Turn it on: repo variable PROJECT_SWEEP_ENABLED = true. Until then only
#      manual runs do anything. Delete the variable to pause the sweep.
on:
  schedule:
    - cron: '*/5 * * * *'
  issues:
    types: [assigned, unassigned]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log the changes without making them
        type: boolean
        default: false

permissions:
  contents: read

# Dry runs get their own group so a scheduled run cannot replace a pending one.
# Real runs queue: at most one waits, and each reads the whole board anyway.
concurrency:
  group: project-status-sweep${{ inputs.dry_run && '-dry' || '' }}
  cancel-in-progress: false

jobs:
  sweep:
    # Forks inherit the schedule; only run here.
    # On/off switch: scheduled and issue-triggered runs only happen while the
    # repo variable PROJECT_SWEEP_ENABLED is 'true'. Manual runs always work, so
    # a dry run is possible while it is off. Unset it to pause the sweep.
    if: >-
      github.repository == 'ExtendDB/extenddb' &&
      (github.event_name == 'workflow_dispatch' || vars.PROJECT_SWEEP_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets live in this environment, which only main can use.
    # deployment: false keeps that, without a deployment record every run.
    environment:
      name: project-board
      deployment: false
    outputs:
      outcome: ${{ steps.sweep.outputs.outcome }}
      summary: ${{ steps.sweep.outputs.summary }}
    steps:
      - name: Check out sweep script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PROJECT_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECT_APP_PRIVATE_KEY }}
          # No repositories list: the token covers the repos the App is
          # installed on, so cards from a newly added repo work once it is.
          owner: ExtendDB
          permission-organization-projects: write
          permission-issues: read
          permission-pull-requests: read

      - name: Sweep board
        id: sweep
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DRY_RUN: ${{ inputs.dry_run == true }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const sweep = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/project-status-sweep.js`);
            await sweep({
              github,
              core,
              dryRun: process.env.DRY_RUN === 'true',
              runUrl: process.env.RUN_URL,
            });

  report:
    # Raise or clear one alert issue. Skipped for dry runs and while the sweep
    # is switched off (no runner is started for nothing).
    needs: sweep
    if: >-
      always() && github.repository == 'ExtendDB/extenddb' &&
      inputs.dry_run != true && needs.sweep.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Raise or clear alert
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULT: ${{ needs.sweep.result }}
          OUTCOME: ${{ needs.sweep.outputs.outcome }}
          SUMMARY: ${{ needs.sweep.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const TITLE = 'Roadmap board sweep needs attention';
            const { RESULT, OUTCOME, SUMMARY, RUN_URL } = process.env;
            const { owner, repo } = context.repo;

            // Cancelled runs (e.g. replaced by a newer one) say nothing about health.
            if (RESULT === 'cancelled' || RESULT === 'skipped') return;
            const healthy = RESULT === 'success' && OUTCOME === 'ok';

            const open = (await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', creator: 'github-actions[bot]', per_page: 100,
            })).find((i) => i.title === TITLE && !i.pull_request);

            if (healthy) {
              if (open) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: open.number, body: `Back to normal: ${RUN_URL}`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: open.number, state: 'closed', state_reason: 'completed',
                });
              }
              return;
            }

            const detail = SUMMARY
              || `The sweep job ended with "${RESULT}" before it could report. `
               + 'Usually this is the GitHub App token: check the App is installed, '
               + 'and that PROJECT_APP_CLIENT_ID / PROJECT_APP_PRIVATE_KEY in the '
               + '"project-board" environment are current.';
            const body = [
              'The scheduled sweep that keeps the Roadmap board Status current reported a problem.',
              'This issue is updated while the problem lasts and closed automatically after a clean run.',
              '',
              `Latest run: ${RUN_URL}`,
              '',
              detail,
            ].join('\n');

            if (open) {
              await github.rest.issues.update({ owner, repo, issue_number: open.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: TITLE, body });
            }
