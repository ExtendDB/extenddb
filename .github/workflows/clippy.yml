name: Clippy
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

# Supersede an in-flight run of the SAME pull request when a new push arrives,
# so repeated pushes do not stack up on a capped pool. Non-PR runs get a group
# unique to the run (run_id): merge-group runs reuse a ref across re-queues,
# and GitHub concurrency replaces a PENDING run in a group even with
# cancel-in-progress false, so keying them by ref would let one merge-group
# run cancel another and evict its queue entry.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clippy:
    # Dedicated ExtendDB runner group (Ubuntu 24.04, 4 vCPU / 16 GB, capped at
    # 20 concurrent). ubuntu-latest is an Amazon-wide shared pool where our jobs
    # waited 10-90 minutes to start (2026-09-29/30); see integration.yml.
    runs-on: extenddb_ubuntu-2404_4-core
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only pushes to main save, so other runs restore main's cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # With the Cassandra and MongoDB crates' `test-hooks` features, so the
      # hook modules (`src/test_hooks.rs`) and their call sites, which only
      # the integration test binaries build otherwise, are linted too. With the
      # bin crate's `mimalloc` feature as well, which no other job builds.
      - run: cargo clippy --all-targets --features extenddb-storage-cassandra/test-hooks,extenddb-storage-mongodb/test-hooks,extenddb/mimalloc -- -D warnings
      # The backup job's kill-point pauses (`EXTENDDB_BACKUP_PAUSE`), which
      # `devtools/backup-kill-points.sh` runs by hand on a build with the
      # feature; no other job builds it.
      - run: cargo clippy --all-targets --features extenddb-engine/backup-test-hooks -- -D warnings
