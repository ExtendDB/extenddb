name: Search inequality filters
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# Same grouping as the other workflows: a new push to a pull request
# supersedes its in-flight run, and every other run has a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The search-inequality-filters Cargo feature is off by default, so no other
# workflow compiles its code or its tests. These jobs build it, lint it, run
# its unit tests, and run the SearchVectors wire tests against a server built
# with it and the search_inequality_filters setting at `all`.
env:
  FEATURES: >-
    extenddb-core/search-inequality-filters,extenddb-engine/search-inequality-filters,extenddb-server/search-inequality-filters,extenddb-storage-sqlite/search-inequality-filters,extenddb-storage-postgres/search-inequality-filters

jobs:
  lint:
    runs-on: extenddb_ubuntu-2404_4-core
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --features "$FEATURES" -- -D warnings
      # The SQLite-only binary, whose backend selection differs from the
      # workspace build's PostgreSQL default.
      - run: cargo clippy -p extenddb --all-targets --no-default-features --features sqlite,search-inequality-filters -- -D warnings

  msrv:
    runs-on: extenddb_ubuntu-2404_4-core
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.91.1"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked --workspace --features "$FEATURES"

  unit:
    runs-on: extenddb_ubuntu-2404_4-core
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: devpass
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 127.0.0.1:5432:5432
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Unit tests of the crates the feature changes
        run: >-
          cargo test --locked --no-fail-fast
          -p extenddb-core -p extenddb-engine -p extenddb-server -p extenddb-storage-sqlite
          --features "extenddb-core/search-inequality-filters,extenddb-engine/search-inequality-filters,extenddb-server/search-inequality-filters,extenddb-storage-sqlite/search-inequality-filters"
      # Same environment as the PostgreSQL storage-level job in
      # integration.yml: the tests create and drop their own databases, and
      # EXTENDDB_TEST_PG_REQUIRED turns a missing connection into a failure.
      - name: PostgreSQL storage tests
        env:
          EXTENDDB_TEST_PG_CONNECTION_STRING: postgresql://postgres:devpass@127.0.0.1:5432
          EXTENDDB_TEST_PG_REQUIRED: "1"
        run: cargo test --locked --no-fail-fast --release -p extenddb-storage-postgres --features search-inequality-filters --tests

  wire:
    runs-on: extenddb_ubuntu-2404_4-core
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: devpass
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 127.0.0.1:5432:5432
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build release
        run: cargo build --locked --release -p extenddb --no-default-features --features ${{ matrix.backend }},search-inequality-filters

      - name: Initialize ExtendDB
        id: init
        run: |
          if [ "${{ matrix.backend }}" = sqlite ]; then
            output=$(./target/release/extenddb init --backend sqlite --config extenddb.toml 2>&1)
          else
            output=$(./target/release/extenddb init --config extenddb.toml \
              --pg-host 127.0.0.1 --pg-port 5432 --pg-user postgres --pg-pass devpass 2>&1)
          fi
          echo "$output"
          password=$(echo "$output" | grep -oP 'Password: \K\S+')
          echo "admin_password=$password" >> "$GITHUB_OUTPUT"

      - name: Start ExtendDB
        run: |
          # --write-pid-file so devtools/run-tests can restart the server with
          # 'extenddb stop' when it needs to apply a config change.
          ./target/release/extenddb serve --config extenddb.toml --foreground --write-pid-file &
          for _ in $(seq 1 30); do
            if curl -sfk https://127.0.0.1:18443/health > /dev/null; then
              echo "Server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          exit 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Every wire test with "vector" in its file or test name, in parallel by
      # file, except the CLI catalog migration file, which builds catalogs of
      # its own and does not depend on the feature. devtools/run-tests writes
      # the setting before the suite starts; the modules read it and fail when
      # the server serves the other grammar.
      - name: Run the vector wire tests
        env:
          EXTENDDB_TEST_ENDPOINT: https://127.0.0.1:18443
          EXTENDDB_ADMIN_USER: admin
          EXTENDDB_ADMIN_PASSWORD: ${{ steps.init.outputs.admin_password }}
          EXTENDDB_TEST_BACKUP_STORE: ${{ matrix.backend == 'sqlite' && 'filesystem' || 'none' }}
          EXTENDDB_TEST_SEARCH_INEQUALITY_FILTERS: all
          EXTENDDB_EXPECT_VECTORS: "1"
        run: devtools/run-tests --extenddb --pytest --parallel --filter "vector and not test_cli"

      - name: Dump server syslog on failure
        if: failure()
        run: sudo journalctl -t extenddb --no-pager -n 500 || true

  search-inequality-filters:
    runs-on: extenddb_ubuntu-2404_4-core
    timeout-minutes: 5
    needs: [lint, msrv, unit, wire]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.lint.result }}" != "success" ] \
              || [ "${{ needs.msrv.result }}" != "success" ] \
              || [ "${{ needs.unit.result }}" != "success" ] \
              || [ "${{ needs.wire.result }}" != "success" ]; then
            exit 1
          fi
