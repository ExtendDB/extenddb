name: Search inequality filters
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# Same grouping as the other workflows: a new push to a pull request
# supersedes its in-flight run, and every other run has a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The search-inequality-filters Cargo feature is on by default, so the other
# workflows build, lint and test it, and their wire tests run with the
# search_inequality_filters setting absent, which gives every account the
# extended grammar. These jobs cover what they do not: the workspace built,
# linted and tested with the feature compiled out, and the vector wire tests
# with the setting written as `off` and as `all`, and against the build with
# the feature compiled out.
#
# The crates take their internal dependencies with default features, so no
# cargo command line compiles the feature out.
# devtools/compile-out-search-inequality-filters removes it from the default
# list of every crate that declares it, which compiles it out of the
# workspace, and checks that nothing enables it.
jobs:
  compiled-out:
    runs-on: extenddb_ubuntu-2404_4-core
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Compile the feature out
        run: devtools/compile-out-search-inequality-filters
      - name: Lint the workspace with the feature compiled out
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Unit tests with the feature compiled out
        run: |
          cargo test --locked --no-fail-fast -p extenddb-core -p extenddb-engine \
            -p extenddb-server -p extenddb-app --lib

  wire:
    runs-on: extenddb_ubuntu-2404_4-core
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
        setting: ["off", all, compiled-out]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: devpass
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 127.0.0.1:5432:5432
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Compile the feature out
        if: matrix.setting == 'compiled-out'
        run: devtools/compile-out-search-inequality-filters

      - name: Build release
        run: cargo build --locked --release -p extenddb --no-default-features --features ${{ matrix.backend }}

      - name: Initialize ExtendDB
        id: init
        run: |
          if [ "${{ matrix.backend }}" = sqlite ]; then
            output=$(./target/release/extenddb init --backend sqlite --config extenddb.toml 2>&1)
          else
            output=$(./target/release/extenddb init --config extenddb.toml \
              --pg-host 127.0.0.1 --pg-port 5432 --pg-user postgres --pg-pass devpass 2>&1)
          fi
          echo "$output"
          password=$(echo "$output" | grep -oP 'Password: \K\S+')
          echo "admin_password=$password" >> "$GITHUB_OUTPUT"

      - name: Start ExtendDB
        run: |
          # --write-pid-file so devtools/run-tests can restart the server with
          # 'extenddb stop' when it needs to apply a config change.
          ./target/release/extenddb serve --config extenddb.toml --foreground --write-pid-file &
          for _ in $(seq 1 30); do
            if curl -sfk https://127.0.0.1:18443/health > /dev/null; then
              echo "Server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          exit 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Every wire test with "vector" in its file or test name, in parallel by
      # file, except the CLI catalog migration file, which builds catalogs of
      # its own and does not depend on the feature. devtools/run-tests writes
      # the setting before the suite starts; the modules read it and fail when
      # the server serves the other grammar. Under `off`, and against the build
      # with the feature compiled out, which has no such setting, the tests of
      # the extended grammar skip.
      - name: Run the vector wire tests
        env:
          EXTENDDB_TEST_ENDPOINT: https://127.0.0.1:18443
          EXTENDDB_ADMIN_USER: admin
          EXTENDDB_ADMIN_PASSWORD: ${{ steps.init.outputs.admin_password }}
          EXTENDDB_TEST_BACKUP_STORE: ${{ matrix.backend == 'sqlite' && 'filesystem' || 'none' }}
          EXTENDDB_TEST_SEARCH_INEQUALITY_FILTERS: ${{ matrix.setting != 'compiled-out' && matrix.setting || '' }}
          EXTENDDB_EXPECT_VECTORS: "1"
        run: devtools/run-tests --extenddb --pytest --parallel --filter "vector and not test_cli"

      - name: Dump server syslog on failure
        if: failure()
        run: sudo journalctl -t extenddb --no-pager -n 500 || true

  search-inequality-filters:
    runs-on: extenddb_ubuntu-2404_4-core
    timeout-minutes: 5
    needs: [compiled-out, wire]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.compiled-out.result }}" != "success" ] \
              || [ "${{ needs.wire.result }}" != "success" ]; then
            exit 1
          fi
