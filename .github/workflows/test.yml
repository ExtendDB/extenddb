name: Test
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# Supersede an in-flight run of the SAME pull request when a new push arrives,
# so repeated pushes do not stack up on a capped pool. Non-PR runs get a group
# unique to the run (run_id): merge-group runs reuse a ref across re-queues,
# and GitHub concurrency replaces a PENDING run in a group even with
# cancel-in-progress false, so keying them by ref would let one merge-group
# run cancel another and evict its queue entry.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run-tests:
    # Dedicated ExtendDB runner group (Ubuntu 24.04, 4 vCPU / 16 GB, capped at
    # 20 concurrent). ubuntu-latest is an Amazon-wide shared pool where our jobs
    # waited 10-90 minutes to start (2026-09-29/30); see integration.yml.
    runs-on: extenddb_ubuntu-2404_4-core
    timeout-minutes: 15
    strategy:
      matrix:
        toolchain: [stable, "1.88.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2

      # Local S3 endpoint for the backup-store conformance suite. moto is a
      # pip package, so it needs no container image; MinIO stopped publishing
      # images in 2026. The suite fails rather than skips when
      # EXTENDDB_TEST_S3_REQUIRED is set and the endpoint is unreachable.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start S3 mock
        run: |
          pip install "moto[server]==5.2.4"
          nohup moto_server -p 9000 > moto.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "moto_server did not start"; cat moto.log; exit 1

      # The AWS_* variables are scoped to the backup-store crate so they do
      # not leak into other crates' tests (the server's dev mode reads them).
      - run: cargo test --workspace --exclude extenddb-backup-store
      - run: cargo test -p extenddb-backup-store
        env:
          EXTENDDB_TEST_S3_REQUIRED: "1"
          EXTENDDB_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          EXTENDDB_TEST_S3_REGION: us-east-1
          # moto accepts any credentials; these are not secrets.
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_REGION: us-east-1

  test:
    runs-on: extenddb_ubuntu-2404_4-core
    timeout-minutes: 15
    needs: run-tests
    if: always()
    steps:
      - run: |
          if [ "${{ needs.run-tests.result }}" != "success" ]; then
            exit 1
          fi
