name: Integration Tests
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# Supersede an in-flight run of the SAME pull request when a new push arrives,
# so two pushes do not each hold six slots on a capped pool. Everything that is
# not a pull request gets a group unique to the run (run_id): merge-group runs
# can share a ref (gh-readonly-queue/main/pr-N-<sha> is reused across
# re-queues of the same PR), and GitHub concurrency replaces a PENDING run in
# a group even with cancel-in-progress false — so keying non-PR runs by ref
# would let one merge-group run cancel another and evict its queue entry.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run-integration:
    # Dedicated ExtendDB runner group (4 vCPU / 16 GB, capped at 20 concurrent),
    # pinned to Ubuntu 24.04. ubuntu-latest is an Amazon-wide pool of 1,000
    # concurrent jobs shared first-come first-served across every org; our jobs
    # sat queued 10–90 minutes behind other teams' load (2026-09-29/30). Pinned
    # rather than "latest" because ubuntu-latest migrates to 26.04 in Oct–Nov
    # 2026 and this compiles Rust; move to 26 deliberately.
    runs-on: extenddb_ubuntu-2404_4-core
    timeout-minutes: 40
    services:
      postgres:
        # pgvector's own image, which is postgres:16 plus the extension. The
        # backend serves vector indexes where the extension is present, so this is
        # what makes the positive paths reachable in CI. The novector job below
        # keeps the refusal paths covered on a plain image.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: devpass
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 127.0.0.1:5432:5432

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release
        run: cargo build --release

      - name: Initialize ExtendDB
        id: init
        run: |
          output=$(./target/release/extenddb init --config extenddb.toml \
            --pg-host 127.0.0.1 --pg-port 5432 --pg-user postgres --pg-pass devpass 2>&1)
          echo "$output"
          password=$(echo "$output" | grep -oP 'Password: \K\S+')
          echo "admin_password=$password" >> "$GITHUB_OUTPUT"

      - name: Start ExtendDB
        run: |
          # --write-pid-file so devtools/run-tests can restart the server with
          # 'extenddb stop' when it needs to apply a config change.
          ./target/release/extenddb serve --config extenddb.toml --foreground --write-pid-file &
          for i in $(seq 1 30); do
            if curl -sk https://127.0.0.1:18443/health | grep -q healthy; then
              echo "Server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # A fresh install's schema, from the catalog init created above before
      # any test ran, against the committed file. On a difference the job
      # fails with the diff and uploads the regenerated file to commit.
      - name: Check the current schema
        run: |
          devtools/schema-dump postgres postgresql://postgres:devpass@127.0.0.1:5432 \
            extenddb_catalog extenddb > schema-postgres.txt
          if ! diff -u docs/schema/postgres.txt schema-postgres.txt; then
            echo "docs/schema/postgres.txt differs from a fresh install: commit the schema-postgres artifact as docs/schema/postgres.txt"
            exit 1
          fi

      - name: Upload the regenerated schema
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: schema-postgres
          path: schema-postgres.txt
          if-no-files-found: ignore

      # PgBouncer 1.26.1 in transaction mode in front of the job's server, for
      # the lock script's pass through a connection pooler. It logs every role
      # in through auth_query as the superuser, so the script's own role needs
      # no entry of its own.
      - name: Start PgBouncer
        run: >-
          docker run -d --name pgbouncer --network host
          -e DB_HOST=127.0.0.1 -e DB_PORT=5432
          -e DB_USER=postgres -e DB_PASSWORD=devpass -e AUTH_USER=postgres
          -e AUTH_TYPE=scram-sha-256 -e POOL_MODE=transaction
          -e LISTEN_ADDR=127.0.0.1 -e LISTEN_PORT=6432
          edoburu/pgbouncer@sha256:8638aa563607256d3c7440437534195f1066a92b68015d89ae9d6b935b444a6d

      # The migration lock and the serving registration between serve and
      # migrate, on a deployment of its own (port 18452), then the commands
      # and serve with the catalog reached through PgBouncer.
      - name: Check serve and migrate on one catalog
        env:
          POOLER_URL: postgresql://127.0.0.1:6432
        run: >-
          devtools/check-postgres-catalog-lock ./target/release/extenddb
          postgresql://postgres:devpass@127.0.0.1:5432 18452

      # The last 0.1.x image's verify, migrate --yes and serve against
      # catalogs this binary created and migrated: what each writes, and that
      # this binary then reports WrittenByOlderRelease and --reconverge
      # restores Current.
      - name: Check the last 0.1.x release against migrated catalogs
        run: |
          docker pull extenddb/extenddb-postgres:0.1.14
          devtools/check-postgres-older-binary ./target/release/extenddb \
            postgresql://postgres:devpass@127.0.0.1:5432 \
            crates/storage-postgres/tests/fixtures/released/0.1.14 \
            extenddb/extenddb-postgres:0.1.14 18453

      - name: Run integration tests
        env:
          EXTENDDB_TEST_ENDPOINT: https://127.0.0.1:18443
          EXTENDDB_ADMIN_USER: admin
          EXTENDDB_ADMIN_PASSWORD: ${{ steps.init.outputs.admin_password }}
          EXTENDDB_TEST_PG_ADMIN_CONNECTION_STRING: postgresql://postgres:devpass@127.0.0.1:5432
        run: devtools/run-tests --extenddb --pytest --comprehensive --parallel --filter "not import_export"

      # run-tests restarts the server daemonized to apply the import/export
      # config, and a daemonized server logs to syslog, not the job log. Without
      # this dump, the storage error behind a client-visible 500 leaves no
      # evidence anywhere in CI.
      - name: Dump server syslog on failure
        if: failure()
        run: sudo journalctl -t extenddb --no-pager -n 500 || true

  run-integration-sqlite:
    runs-on: extenddb_ubuntu-2404_4-core
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release (SQLite backend)
        run: cargo build --release -p extenddb --no-default-features --features sqlite

      # The migration lock between serve and migrate, on a catalog of its own
      # (port 18450), before the suite's server starts.
      - name: Check serve and migrate on one catalog
        run: devtools/check-sqlite-catalog-lock ./target/release/extenddb 18450

      # The last 0.1.x dev image's serve and migrate --yes against catalogs
      # this binary migrated: what each writes, and that this binary then
      # reports WrittenByOlderRelease and --reconverge restores Current.
      - name: Check the last 0.1.x release against migrated catalogs
        run: |
          docker pull extenddb/extenddb-dev:0.1.14
          devtools/check-sqlite-older-binary ./target/release/extenddb \
            crates/storage-sqlite/tests/fixtures/released/dev-image-0.1.14.sql \
            extenddb/extenddb-dev:0.1.14 18451

      - name: Initialize ExtendDB
        id: init
        run: |
          output=$(./target/release/extenddb init --backend sqlite --config extenddb.toml 2>&1)
          echo "$output"
          password=$(echo "$output" | grep -oP 'Password: \K\S+')
          echo "admin_password=$password" >> "$GITHUB_OUTPUT"

      # A fresh install's schema against the committed file. On a difference
      # the job fails with the diff and uploads the regenerated file to commit.
      - name: Check the current schema
        run: |
          devtools/schema-dump sqlite extenddb.sqlite > schema-sqlite.txt
          if ! diff -u docs/schema/sqlite.txt schema-sqlite.txt; then
            echo "docs/schema/sqlite.txt differs from a fresh install: commit the schema-sqlite artifact as docs/schema/sqlite.txt"
            exit 1
          fi

      - name: Upload the regenerated schema
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: schema-sqlite
          path: schema-sqlite.txt
          if-no-files-found: ignore

      - name: Start ExtendDB
        run: |
          # --write-pid-file so devtools/run-tests can restart the server with
          # 'extenddb stop' when it needs to apply a config change.
          ./target/release/extenddb serve --config extenddb.toml --foreground --write-pid-file &
          for i in $(seq 1 30); do
            if curl -sk https://127.0.0.1:18443/health | grep -q healthy; then
              echo "Server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run integration tests
        env:
          EXTENDDB_TEST_ENDPOINT: https://127.0.0.1:18443
          EXTENDDB_ADMIN_USER: admin
          EXTENDDB_ADMIN_PASSWORD: ${{ steps.init.outputs.admin_password }}
        run: devtools/run-tests --extenddb --pytest --comprehensive --parallel --filter "not import_export"

      # Same rationale as the postgres job: the daemonized server logs to
      # syslog, so this dump is the only server-side evidence on failure.
      - name: Dump server syslog on failure
        if: failure()
        run: sudo journalctl -t extenddb --no-pager -n 500 || true

  run-integration-dev-mode:
    # dev-mode was shipped with no CI coverage at all, which is how the batch and
    # transaction authorization regression reached main: the build compiled, so
    # a feature-matrix check passed, while nothing ever issued a request against
    # a dev-mode server. This job starts one and exercises the data plane.
    runs-on: extenddb_ubuntu-2404_4-core
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release (dev mode, in-memory SQLite)
        run: cargo build --release -p extenddb --no-default-features --features sqlite-memory,dev-mode

      - name: Start ExtendDB in dev mode
        run: |
          # No config file on purpose: dev mode falls back to built-in defaults,
          # which is the zero-config path a user gets, and the one the profile
          # documents as a DynamoDB Local replacement.
          ./target/release/extenddb serve --foreground --port 18444 --config /nonexistent.toml &
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:18444/health | grep -q healthy; then
              echo "Server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run dev-mode authorization tests
        env:
          EXTENDDB_TEST_ENDPOINT: http://127.0.0.1:18444
          EXTENDDB_TEST_DEV_MODE: "1"
          AWS_DEFAULT_REGION: us-east-1
          # The seeded zero-config dev credential. AWS's documented example key,
          # which grants nothing anywhere; it exists so SigV4 has a key to verify.
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
        run: python3 -m pytest tests/test_dev_mode_authorization.py -v

  run-rust-integration:
    runs-on: extenddb_ubuntu-2404_4-core
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: devpass
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 127.0.0.1:5432:5432

    steps:
      - uses: actions/checkout@v6
        with:
          # migrations_tag_blobs reads the release tags.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release
        run: cargo build --release

      - name: Initialize ExtendDB
        id: init
        run: |
          output=$(./target/release/extenddb init --config extenddb.toml \
            --pg-host 127.0.0.1 --pg-port 5432 --pg-user postgres --pg-pass devpass 2>&1)
          echo "$output"
          echo "admin_password=$(echo "$output" | grep -oP 'Password: \K\S+')" >> "$GITHUB_OUTPUT"
          echo "account_id=$(echo "$output" | grep -oP 'Account ID: \K\S+')" >> "$GITHUB_OUTPUT"

      - name: Enable provisioned-capacity throttling enforcement
        run: ./target/release/extenddb settings set throttling_enabled true

      - name: Start ExtendDB
        run: |
          # --write-pid-file so devtools/run-tests can restart the server with
          # 'extenddb stop' when it needs to apply a config change.
          ./target/release/extenddb serve --config extenddb.toml --foreground --write-pid-file &
          for i in $(seq 1 30); do
            if curl -sk https://127.0.0.1:18443/health | grep -q healthy; then
              echo "Server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          exit 1

      # Driven through devtools/run-tests rather than a bare `cargo test`, because the
      # harness provisions what several suites require and a raw invocation does not:
      # devtools/provision-test-credentials creates account 123456789012 with an IAM
      # user, access key and full-access policy, and exports the credentials.
      #
      # batch_transact_authz targets that account and skips itself when
      # EXTENDDB_ADMIN_PASSWORD is absent, so under a bare `cargo test` all ten of its
      # tests reported ok WITHOUT EXECUTING, in every run since they landed in #232.
      # The vector backfill tests need the same access to set the batch delay.
      - name: Run Rust integration tests
        env:
          EXTENDDB_TEST_ENDPOINT: https://127.0.0.1:18443
          AWS_DEFAULT_REGION: us-east-1
          EXTENDDB_ADMIN_USER: admin
          EXTENDDB_ADMIN_PASSWORD: ${{ steps.init.outputs.admin_password }}
          # PostgreSQL now serves vector search against a server with pgvector,
          # which this job's image has. Both vector suites adapt to whatever the
          # backend reports, so without a pinned expectation the positive suite
          # could skip every assertion and still report green. "1" makes those
          # tests mandatory. The refusal suite moves to the novector job, which is
          # the only place those assertions still mean anything.
          EXTENDDB_EXPECT_VECTORS: "1"
        run: devtools/run-tests --extenddb --rust-integration --release

      # The control plane for vector indexes is not reachable over the wire while
      # this backend declares no vector search capability, so its tests drive the
      # storage layer directly against this job's PostgreSQL. The PutItem create
      # race tests hold a create open in an outside transaction, the
      # write-transaction conflict tests force a deadlock, and the backup restore
      # cases need catalog rows the current binary would not write; all need
      # direct access. The online GSI build tests reorder queue rows by hand and
      # pause writers with a test hook. They build their own throwaway databases;
      # the connection string is the server, not a database. `--tests` runs
      # every target of the crate, so a new test file needs no edit here, and
      # EXTENDDB_TEST_PG_REQUIRED turns a test's skip for a missing connection
      # string into a failure.
      - name: Run PostgreSQL storage-level tests
        # table_snapshot: the SnapshotEngine consistency check; it needs the
        # shared page-size hook, compiled only into the crate's own test
        # build, and scratch databases it creates and drops itself.
        env:
          EXTENDDB_TEST_PG_CONNECTION_STRING: postgresql://postgres:devpass@127.0.0.1:5432
          # table_snapshot fails rather than skips without the string above.
          EXTENDDB_TEST_PG_REQUIRED: "1"
        run: cargo test --release -p extenddb-storage-postgres --tests

      # The daemonized server logs to syslog; dump it so server-side failures
      # are diagnosable from the job log.
      - name: Dump server syslog on failure
        if: failure()
        run: sudo journalctl -t extenddb --no-pager -n 500 || true

  # The runtime-detection proof: the same binary, against a PostgreSQL with no
  # pgvector, must refuse vector indexes over the wire. Today the job above runs
  # on a plain image too, so this looks like a duplicate of it; it is not, because
  # that job moves to the pgvector image when the search path lands and its
  # EXTENDDB_EXPECT_VECTORS flips to "1". Without this job the refusal surface
  # would stop being tested at exactly that point.
  run-rust-integration-postgres-novector:
    runs-on: extenddb_ubuntu-2404_4-core
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: devpass
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 127.0.0.1:5432:5432

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release
        run: cargo build --release

      - name: Initialize ExtendDB
        id: init
        run: |
          output=$(./target/release/extenddb init --config extenddb.toml \
            --pg-host 127.0.0.1 --pg-port 5432 --pg-user postgres --pg-pass devpass 2>&1)
          echo "$output"
          echo "admin_password=$(echo "$output" | grep -oP 'Password: \K\S+')" >> "$GITHUB_OUTPUT"

      - name: Start ExtendDB
        run: |
          ./target/release/extenddb serve --config extenddb.toml --foreground --write-pid-file &
          for i in $(seq 1 30); do
            if curl -sk https://127.0.0.1:18443/health | grep -q healthy; then
              echo "Server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          exit 1

      - name: Run the vector refusal suite
        env:
          EXTENDDB_TEST_ENDPOINT: https://127.0.0.1:18443
          AWS_DEFAULT_REGION: us-east-1
          EXTENDDB_ADMIN_USER: admin
          EXTENDDB_ADMIN_PASSWORD: ${{ steps.init.outputs.admin_password }}
          # "0" makes the refusal assertions mandatory: the suite adapts to what
          # the backend reports, so without this it could skip every assertion
          # and still report green.
          EXTENDDB_EXPECT_VECTORS: "0"
        run: >-
          devtools/run-tests --extenddb --rust-integration --release
          --filter vector_index_unsupported

      # The migration tests on a server without pgvector: the released vector
      # states skip, naming pgvector, and every other case runs. The other
      # storage-level tests build extension-free scratch databases and behave
      # the same on either image, so the job above covers them.
      - name: Run the PostgreSQL migration tests without pgvector
        env:
          EXTENDDB_TEST_PG_CONNECTION_STRING: postgresql://postgres:devpass@127.0.0.1:5432
          EXTENDDB_TEST_PG_REQUIRED: "1"
        run: >-
          cargo test --release -p extenddb-storage-postgres
          --test migrations_fresh --test migrations_released --test migrations_crash
          --test migrations_golden --test migrations_guards --test migrations_runs

      # The daemonized server logs to syslog; dump it so server-side failures
      # are diagnosable from the job log.
      - name: Dump server syslog on failure
        if: failure()
        run: sudo journalctl -t extenddb --no-pager -n 500 || true
  run-rust-integration-sqlite:
    runs-on: extenddb_ubuntu-2404_4-core
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release (SQLite backend)
        run: cargo build --release -p extenddb --no-default-features --features sqlite

      - name: Initialize ExtendDB
        id: init
        run: |
          output=$(./target/release/extenddb init --backend sqlite --config extenddb.toml 2>&1)
          echo "$output"
          echo "admin_password=$(echo "$output" | grep -oP 'Password: \K\S+')" >> "$GITHUB_OUTPUT"

      - name: Enable provisioned-capacity throttling enforcement
        run: ./target/release/extenddb settings set throttling_enabled true

      - name: Start ExtendDB
        run: |
          ./target/release/extenddb serve --config extenddb.toml --foreground --write-pid-file &
          for i in $(seq 1 30); do
            if curl -sk https://127.0.0.1:18443/health | grep -q healthy; then
              echo "Server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start"
          exit 1

      # Driven through devtools/run-tests rather than a bare `cargo test`, because the
      # harness provisions what several suites require and a raw invocation does not:
      # devtools/provision-test-credentials creates account 123456789012 with an IAM
      # user, access key and full-access policy, and exports the credentials.
      #
      # batch_transact_authz targets that account and skips itself when
      # EXTENDDB_ADMIN_PASSWORD is absent, so under a bare `cargo test` all ten of its
      # tests reported ok WITHOUT EXECUTING, in every run since they landed in #232.
      # The vector backfill tests need the same access to set the batch delay.
      - name: Run Rust integration tests
        env:
          EXTENDDB_TEST_ENDPOINT: https://127.0.0.1:18443
          AWS_DEFAULT_REGION: us-east-1
          EXTENDDB_ADMIN_USER: admin
          EXTENDDB_ADMIN_PASSWORD: ${{ steps.init.outputs.admin_password }}
          # Both vector suites self-skip when the backend is the wrong kind, so without
          # this the positive suite could skip every assertion and still report green,
          # which is what would happen if the backend lost the capability. Pinning the
          # expectation turns that skip into a failure.
          EXTENDDB_EXPECT_VECTORS: "1"
        run: devtools/run-tests --extenddb --rust-integration --release

      # The daemonized server logs to syslog; dump it so server-side failures
      # are diagnosable from the job log.
      - name: Dump server syslog on failure
        if: failure()
        run: sudo journalctl -t extenddb --no-pager -n 500 || true

  integration:
    runs-on: extenddb_ubuntu-2404_4-core
    timeout-minutes: 40
    needs:
      [
        run-integration,
        run-integration-sqlite,
        run-integration-dev-mode,
        run-rust-integration,
        run-rust-integration-postgres-novector,
        run-rust-integration-sqlite,
      ]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.run-integration.result }}" != "success" ] || \
             [ "${{ needs.run-integration-sqlite.result }}" != "success" ] || \
             [ "${{ needs.run-integration-dev-mode.result }}" != "success" ] || \
             [ "${{ needs.run-rust-integration.result }}" != "success" ] || \
             [ "${{ needs.run-rust-integration-postgres-novector.result }}" != "success" ] || \
             [ "${{ needs.run-rust-integration-sqlite.result }}" != "success" ]; then
            exit 1
          fi
