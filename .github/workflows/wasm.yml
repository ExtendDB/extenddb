#
# WebAssembly browser-build gate for extenddb-wasm-adapter.
#
# The adapter compiles the engine, auth, core and the SQLite backend to
# wasm32-unknown-unknown and runs them in a browser over an in-memory SQLite
# (sqlite-wasm-rs) behind a synchronous shim. No other workflow builds that
# target, so without this job a change can break the wasm build with every
# other check green: a new aws-lc-rs call, a call in a wasm-compiled workspace
# crate that is known to trap or hang on wasm32 (the calls listed in
# devtools/wasm-clippy/clippy.toml), or a shim regression are all invisible to
# the native test and clippy jobs. It is not a required status check on main
# today; it must become one (a maintainer adds it to main's required checks)
# for a red run to block a merge. It reports on every pull request rather than
# being path-filtered so that it can be made required: a path-filtered required
# check never reports on a pull request outside its paths, and that pull
# request can never merge (see licenses.yml).

name: WebAssembly

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# Supersede an in-flight run of the SAME pull request when a new push arrives,
# so repeated pushes do not stack up on a capped pool. Non-PR runs get a group
# unique to the run (run_id): merge-group runs reuse a ref across re-queues,
# and GitHub concurrency replaces a PENDING run in a group even with
# cancel-in-progress false, so keying them by ref would let one merge-group
# run cancel another and evict its queue entry.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wasm:
    # Dedicated ExtendDB runner group (Ubuntu 24.04, 4 vCPU / 16 GB, capped at
    # 20 concurrent). ubuntu-latest is an Amazon-wide shared pool where our jobs
    # waited 10-90 minutes to start (2026-09-29/30); see integration.yml.
    runs-on: extenddb_ubuntu-2404_4-core
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          # Pinned, like the clippy job, so a new stable does not change which
          # lints fire. The crates build with the workspace rust-version
          # (1.91.1); this is the lint/build toolchain, above that floor.
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only pushes to main save, so other runs restore main's cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # wasm-bindgen-test 0.3.80's Node harness needs a V8 newer than the
          # one in Node 18.
          node-version: "22"

      # sqlite-wasm-rs compiles SQLite from C through the cc crate, which uses
      # clang for wasm32. The package is unversioned: the step only makes sure
      # a clang is on PATH. Rust links wasm32 with its bundled rust-lld.
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      # wasm-bindgen-cli is pinned to the version of the wasm-bindgen crate in
      # Cargo.lock (0.2.130). Its wasm-bindgen, which writes the JS glue, and
      # its wasm-bindgen-test-runner, which runs the two test steps below, read
      # the description the crate's macros put into the module, and both stop
      # with a "different bindgen format" error when that description's schema
      # version is not their own. wasm-pack, which builds the --target web
      # module for the headless parity run, takes a wasm-bindgen from PATH only
      # when its version is the one in Cargo.lock; otherwise it downloads that
      # version, which the corpus step's --mode no-install forbids. Both land
      # in ~/.cargo/bin; caching them skips the multi-minute compile on a hit.
      - name: Cache wasm tooling
        id: cache-wasm-tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
            ~/.cargo/bin/wasm-pack
          key: wasm-tools-wbindgen0.2.130-wpack0.15.1-${{ runner.os }}
      - name: Install wasm tooling
        if: steps.cache-wasm-tools.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --version 0.2.130 wasm-bindgen-cli
          cargo install --locked --version 0.15.1 wasm-pack

      # Each step below runs the commands devtools/run-wasm-step holds for it,
      # and that script documents them. devtools/run-tests --wasm, --headless
      # and --wasm-test run the same steps through it, after checking that
      # this file runs each of them as `devtools/run-wasm-step <step>` and
      # nothing else, and that every other step is a setup step (see
      # wasm_workflow_problems in devtools/run-tests).
      - name: Build the adapter for wasm32
        run: devtools/run-wasm-step build
      - name: Clippy the wasm32 build
        run: devtools/run-wasm-step clippy
      - name: Self-test the wasm32 clippy guard
        run: devtools/run-wasm-step guard
      - name: Clippy the adapter (pedantic) for wasm32
        run: devtools/run-wasm-step pedantic
      - name: Core wasm tests under Node
        run: devtools/run-wasm-step core
      - name: SQLite shim wasm tests under Node
        run: devtools/run-wasm-step shim
      - name: Headless parity corpus under Node
        run: devtools/run-wasm-step corpus
