#
# WebAssembly browser-build gate for extenddb-wasm-adapter.
#
# The adapter compiles the engine, auth, core and the SQLite backend to
# wasm32-unknown-unknown and runs them in a browser over an in-memory SQLite
# (sqlite-wasm-rs) behind a synchronous shim. No other workflow builds that
# target, so without this job a change can break the wasm build with every
# other check green: a new aws-lc-rs call, a call in a wasm-compiled workspace
# crate that is known to trap or hang on wasm32 (the calls listed in
# devtools/wasm-clippy/clippy.toml), or a shim regression are all invisible to
# the native test and clippy jobs. It is not a required status check on main
# today; it must become one (a maintainer adds it to main's required checks)
# for a red run to block a merge. It reports on every pull request rather than
# being path-filtered so that it can be made required: a path-filtered required
# check never reports on a pull request outside its paths, and that pull
# request can never merge (see licenses.yml).

name: WebAssembly

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# Supersede an in-flight run of the SAME pull request when a new push arrives,
# so repeated pushes do not stack up on a capped pool. Non-PR runs get a group
# unique to the run (run_id): merge-group runs reuse a ref across re-queues,
# and GitHub concurrency replaces a PENDING run in a group even with
# cancel-in-progress false, so keying them by ref would let one merge-group
# run cancel another and evict its queue entry.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wasm:
    # Dedicated ExtendDB runner group (Ubuntu 24.04, 4 vCPU / 16 GB, capped at
    # 20 concurrent). ubuntu-latest is an Amazon-wide shared pool where our jobs
    # waited 10-90 minutes to start (2026-09-29/30); see integration.yml.
    runs-on: extenddb_ubuntu-2404_4-core
    timeout-minutes: 30
    env:
      # core's wasm tests (src/crypto.rs, src/limits/mod.rs) and the SQLite
      # shim's tests/wasm_shim.rs are wasm-bindgen-test cases; they run under
      # Node through the matching wasm-bindgen-test-runner (installed below,
      # same version as the wasm-bindgen crate in Cargo.lock). The variable is
      # read only when a wasm `cargo test` executes, so it does not affect the
      # build or clippy steps.
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          # Pinned, like the clippy job, so a new stable does not change which
          # lints fire. The crates build with the workspace rust-version
          # (1.91.1); this is the lint/build toolchain, above that floor.
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only pushes to main save, so other runs restore main's cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # wasm-bindgen-test 0.3.80's Node harness needs a V8 newer than the
          # one in Node 18.
          node-version: "22"

      # sqlite-wasm-rs compiles SQLite from C through the cc crate, which uses
      # clang for wasm32. The package is unversioned: the step only makes sure
      # a clang is on PATH. Rust links wasm32 with its bundled rust-lld.
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      # wasm-bindgen-cli is pinned to the version of the wasm-bindgen crate in
      # Cargo.lock (0.2.130). Its wasm-bindgen, which writes the JS glue, and
      # its wasm-bindgen-test-runner, which runs the two test steps below, read
      # the description the crate's macros put into the module, and both stop
      # with a "different bindgen format" error when that description's schema
      # version is not their own. wasm-pack, which builds the --target web
      # module for the headless parity run, takes a wasm-bindgen from PATH only
      # when its version is the one in Cargo.lock; otherwise it downloads that
      # version, which the corpus step's --mode no-install forbids. Both land
      # in ~/.cargo/bin; caching them skips the multi-minute compile on a hit.
      - name: Cache wasm tooling
        id: cache-wasm-tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
            ~/.cargo/bin/wasm-pack
          key: wasm-tools-wbindgen0.2.130-wpack0.15.1-${{ runner.os }}
      - name: Install wasm tooling
        if: steps.cache-wasm-tools.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --version 0.2.130 wasm-bindgen-cli
          cargo install --locked --version 0.15.1 wasm-pack

      - name: Build the adapter for wasm32
        run: cargo build --locked -p extenddb-wasm-adapter --target wasm32-unknown-unknown

      # Lints the adapter and every workspace crate it compiles for wasm32
      # (without --no-deps, clippy lints each workspace dependency too), with
      # the lists in devtools/wasm-clippy/clippy.toml, which name the calls
      # known to trap or hang when they run on wasm32. -D warnings also makes
      # errors of clippy's await_holding_lock and await_holding_refcell_ref,
      # which report a std lock guard or a RefCell borrow held across an
      # .await (that file's header says why that traps on wasm32). It sees
      # workspace code only: a call a dependency makes in its own code is not
      # seen (the file's header names the known case), nor is a call the
      # lists do not name. The headless parity corpus below is the runtime
      # check. CLIPPY_CONF_DIR is set on this step only, so native clippy
      # keeps the repository's defaults. --lib checks the adapter's library
      # alone, which is also what cargo checks by default here: the adapter
      # has no binary target, and tests are not a default target.
      - name: Clippy the wasm32 build
        env:
          CLIPPY_CONF_DIR: ${{ github.workspace }}/devtools/wasm-clippy
        run: cargo clippy --locked -p extenddb-wasm-adapter --lib --target wasm32-unknown-unknown -- -D warnings

      # Reads clippy.toml and fails if an entry has no probe in the script or
      # does not resolve, or if the step above accepts a call to one, made
      # directly or through an import; the probes go into a copy of the
      # checkout. It also fails if a crate the wasm build compiles allows or
      # expects clippy::all, clippy::style, clippy::suspicious or warnings
      # (except on the `mod` line of a catalog migration's code-body module,
      # which CONTRIBUTING.md declares that way), the disallowed lints without
      # a reason or with an empty or whitespace-only one, or
      # await_holding_lock or await_holding_refcell_ref at all, and if its own
      # probes of those lint settings are not refused or accepted as it lists.
      # Needs Python 3.11 or later (tomllib), as devtools/check-crate-packages
      # does in test.yml's package job, which runs on the same runner.
      - name: Self-test the wasm32 clippy guard
        run: python3 devtools/check-wasm-clippy-guard

      # The adapter's own code, with the pedantic group the step above does
      # not enable. --all-targets also checks the adapter's test targets for
      # wasm32, with the dev-dependencies that target selects. Their tests are
      # native only (tests/parity.rs and the library's test module are
      # cfg-gated off wasm32), so on wasm32 the step lints the library in its
      # test configuration as well and fails when a test target or a
      # dev-dependency stops building there.
      - name: Clippy the adapter (pedantic) for wasm32
        run: cargo clippy --locked --no-deps -p extenddb-wasm-adapter --all-targets --target wasm32-unknown-unknown -- -D warnings -W clippy::pedantic

      # extenddb-core's wasm32 unit tests, under Node: the cases of its wasm
      # crypto backend (sha2/hmac/subtle/aes-gcm/getrandom), which runs in no
      # native test (known vectors, constant-time equality, random fill, and
      # seal/open round trips, refusals and sealed vectors), and the test of
      # limits::page_size, which on wasm32 runs with a 32-bit usize.
      #
      # This step and the next run `cargo test` through
      # devtools/run-wasm-test-suite, because `cargo test` exits 0 when a
      # test binary holds no test: if the cases lost their wasm_bindgen_test
      # attributes, the step would pass with nothing run. The script fails
      # unless the run reports each test the suite names there `ok`, and no
      # other test.
      - name: Core wasm tests under Node
        run: devtools/run-wasm-test-suite core

      # The synchronous SQLite shim is the wasm backend. tests/wasm_shim.rs
      # holds one table with a row per shim rule (decoding, binding,
      # multi-statement SQL, fetch, transactions, the pool, the one location
      # it opens, connection settings) and two tests that drive the backend
      # with requests whose handling depends on the target: an UpdateTable
      # that creates a vector index, with an expected answer per target, and a
      # Scan whose Limit is above u32::MAX, which expects the same answer on
      # both. This step runs them on wasm32 under Node; the same tests run
      # natively against sqlx in the workspace `cargo test`, which checks
      # their expected outcomes.
      - name: SQLite shim wasm tests under Node
        run: devtools/run-wasm-test-suite shim

      # Builds the browser module with wasm-bindgen and runs the shared parity
      # corpus through it under Node: the same cases as the native test
      # (crates/wasm-adapter/tests/parity.rs, against sqlx and the C SQLite),
      # with its assertions except where a case carries an `onWasm`
      # expectation.
      #
      # wasm-pack downloads no tool here. --no-opt skips wasm-opt. Without
      # it, wasm-pack runs the wasm-opt on PATH or in its download cache, and,
      # in its default install mode, when it has neither it first downloads
      # binaryen version_130 from GitHub releases, which it does not check
      # against a checksum. The step skips wasm-opt rather than pin a checksum
      # for it: wasm-opt is an optimizer (here it makes the module about a
      # quarter smaller) and is not meant to change the answers the corpus
      # checks. No step runs the corpus over wasm-opt's output, which is the
      # module the README's build command produces. --mode no-install forbids
      # wasm-pack to download or install wasm-bindgen: it uses a wasm-bindgen
      # of the version in Cargo.lock from PATH (the tool cache or the install
      # step above puts one there) or from its download cache, and otherwise
      # stops. wasm-pack would add the wasm32 target with rustup if the
      # toolchain lacked it; the toolchain step installs it.
      #
      # wasm-pack does make one request of its own: at the start of every run
      # it asks crates.io (https://crates.io/api/v1/crates/wasm-pack) for the
      # latest wasm-pack version, unless the wasm-pack.stamp file it writes
      # beside its binary after asking is less than 25 hours old. The tool
      # cache above does not keep that file. The answer only decides whether
      # wasm-pack ends with a warning; when the request fails, the warning is
      # "failed to get wasm-pack version" and the build goes on.
      - name: Headless parity corpus under Node
        run: |
          wasm-pack build --target web --release --no-opt --mode no-install crates/wasm-adapter --out-dir parity/pkg
          node crates/wasm-adapter/parity/run.mjs
