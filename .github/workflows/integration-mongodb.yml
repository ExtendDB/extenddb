name: MongoDB Integration Tests

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# The MongoDB backend needs a replica set (single-node --replSet + rs.initiate()
# + wait-for-PRIMARY) for transactions and streams, which GitHub `services:`
# cannot express. `devtools/run-mongodb-tests` performs that bootstrap, then
# init/serve/provision extenddb and delegates the workload to
# `run-tests --backend mongodb`, tearing everything down on exit. Both jobs
# reuse it so CI runs the exact path developers run locally (no drift), while
# splitting pytest and rust into parallel jobs the way integration.yml does.
# Supersede an in-flight run of the SAME pull request when a new push arrives,
# so repeated pushes do not stack up on a capped pool. Non-PR runs get a group
# unique to the run (run_id): merge-group runs reuse a ref across re-queues,
# and GitHub concurrency replaces a PENDING run in a group even with
# cancel-in-progress false, so keying them by ref would let one merge-group
# run cancel another and evict its queue entry.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One release build shared by the jobs that test it; see integration.yml.
  build-mongodb:
    runs-on: extenddb_ubuntu-2404_4-core
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          # Only pushes to main save, so other runs restore main's cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build release (mongodb backend)
        run: cargo build --release --no-default-features --features mongodb-test-hooks
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: extenddb-mongodb
          path: target/release/extenddb
          if-no-files-found: error
          retention-days: 1
          # A re-run of a failed job uploads the same name again.
          overwrite: true

  mongodb-pytest:
    # Dedicated ExtendDB runner group (Ubuntu 24.04, 4 vCPU / 16 GB, capped at
    # 20 concurrent). ubuntu-latest is an Amazon-wide shared pool where our jobs
    # waited 10-90 minutes to start (2026-09-29/30); see integration.yml.
    runs-on: extenddb_ubuntu-2404_4-core
    timeout-minutes: 40
    needs: build-mongodb
    # Three shards by test file; mongodb-integration checks that together
    # they collected every test of the whole suite.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      EXTENDDB_TEST_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: extenddb-mongodb
          path: target/release
      # Artifacts do not keep file modes.
      - run: chmod +x target/release/extenddb
      - name: Install Terraform (pinned version, checksum asserted)
        run: echo "TERRAFORM=$(tests/terraform/install-terraform.sh "$RUNNER_TEMP/terraform")" >> "$GITHUB_ENV"
      - name: Run MongoDB pytest suite
        env:
          # run-mongodb-tests gives the server a filesystem [backup.store]
          # under its output directory: CreateBackup is the store-backed job
          # and the restore cells (tests/test_mongodb_backup_restore.py)
          # rewrite prefixes under that root.
          EXTENDDB_TEST_BACKUP_STORE: filesystem
        run: devtools/run-mongodb-tests -- --pytest --comprehensive --terraform --parallel

      # mongodb-integration checks these lists.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: shards-mongodb-pytest-${{ matrix.shard }}
          path: discussions/shards/
          if-no-files-found: warn
          retention-days: 1
          # A re-run of a failed job uploads the same name again.
          overwrite: true

  # SnapshotEngine consistency check against a disposable replica set. The
  # tests build their own per-test scratch databases (snap<uuid>_cat and
  # _data) and drop them; they run in this job because it is the one that
  # exports EXTENDDB_TEST_MONGODB_URI to cargo test.
  mongodb-snapshot:
    runs-on: extenddb_ubuntu-2404_4-core
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          # Only pushes to main save, so other runs restore main's cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Start replica set
        # Same bootstrap developers run locally; --mongo-only skips the
        # server and prints the URI. No pipe: a bootstrap failure must fail
        # this step, not the next one's connection attempt.
        run: devtools/run-mongodb-tests --mongo-only --mongo-port 27018
      - name: Start standalone mongod
        # No --replSet: a_standalone_server_is_unsupported checks that a
        # server which cannot serve snapshot reads answers NotAReplicaSet and
        # the open maps it to Unsupported. Published on 127.0.0.1 only.
        run: |
          docker run -d --name extenddb-snapshot-standalone-27019 \
            -p 127.0.0.1:27019:27017 mongo:7
          for _ in $(seq 1 60); do
            if docker exec extenddb-snapshot-standalone-27019 \
                mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' 2>/dev/null \
                | grep -qx 1; then
              exit 0
            fi
            sleep 1
          done
          echo "standalone mongod did not answer ping within 60 s" >&2
          docker logs extenddb-snapshot-standalone-27019 >&2 || true
          exit 1
      - name: Run snapshot tests
        # The tests serialise themselves on the snapshot hooks lock; the
        # default parallel runner is what developers get locally and what
        # this checks.
        env:
          EXTENDDB_TEST_MONGODB_URI: mongodb://127.0.0.1:27018/?directConnection=true
          EXTENDDB_TEST_MONGODB_STANDALONE_URI: mongodb://127.0.0.1:27019/?directConnection=true
          EXTENDDB_TEST_MONGODB_REQUIRED: "1"
        run: cargo test -p extenddb-storage-mongodb snapshot_engine
      - name: Stop MongoDB containers
        if: always()
        run: docker rm -f extenddb-runtests-mongo-27018 extenddb-snapshot-standalone-27019

  mongodb-rust:
    runs-on: extenddb_ubuntu-2404_4-core
    # The job took up to 38 min 42 s on main's CI in November 2026, near the
    # old 40-minute bound; 55 leaves room for a slow runner.
    timeout-minutes: 55
    needs: build-mongodb
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          # Only pushes to main save, so other runs restore main's cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      # After the cache restore, so a cached target/ cannot replace it.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: extenddb-mongodb
          path: target/release
      # Artifacts do not keep file modes.
      - run: chmod +x target/release/extenddb
      - name: Run MongoDB rust integration suite
        env:
          # run-mongodb-tests gives the server a filesystem [backup.store]:
          # the Rust backup tests restore the store-backed job's backups.
          EXTENDDB_TEST_BACKUP_STORE: filesystem
        run: devtools/run-mongodb-tests --rust-live -- --rust --rust-integration

  # The store-backed CreateBackup on MongoDB: a server with a filesystem
  # store, the backup selection of the pytest suite with
  # EXTENDDB_TEST_BACKUP_STORE=filesystem (the fidelity suite's store branch,
  # the ABAC and authorization backup cells), and the job suite
  # (tests/test_backup_job.py), which starts servers of its own on a replica
  # set of its own: the catalog's database names are fixed per replica set,
  # and each of its tests destroys and initializes the catalog.
  mongodb-backup-store:
    runs-on: extenddb_ubuntu-2404_4-core
    timeout-minutes: 40
    needs: build-mongodb
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: extenddb-mongodb
          path: target/release
      # Artifacts do not keep file modes.
      - run: chmod +x target/release/extenddb
      - name: Run the backup selection against a filesystem store
        env:
          EXTENDDB_TEST_BACKUP_STORE: filesystem
        run: |
          devtools/run-mongodb-tests --mongo-port 27022 --port 18453 \
            --backup-store-root "$RUNNER_TEMP/backups" \
            -- --pytest --parallel --filter "backup"
      - name: Start the job suite's replica set
        # No pipe: a bootstrap failure must fail this step.
        run: devtools/run-mongodb-tests --mongo-only --mongo-port 27023
      - name: Run the backup job suite
        env:
          EXTENDDB_BINARY: ./target/release/extenddb
          EXTENDDB_TEST_MONGODB_URI: mongodb://127.0.0.1:27023/?replicaSet=rs0&directConnection=true
        run: python3 -m pytest tests/test_backup_job.py -v -rP -p no:cacheprovider
      - name: Stop the job suite's replica set
        if: always()
        run: docker rm -f extenddb-runtests-mongo-27023
      - name: Dump server syslog on failure
        if: failure()
        run: sudo journalctl -t extenddb --no-pager -n 500 || true

  # The catalog migrations against released catalogs and released binaries,
  # each check on a mongo:7 replica set of its own that the script starts
  # with its ports on 127.0.0.1 and removes. The schema check uploads the
  # regenerated file to commit when it differs.
  mongodb-catalog:
    runs-on: extenddb_ubuntu-2404_4-core
    timeout-minutes: 40
    needs: build-mongodb
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: extenddb-mongodb
          path: target/release
      # Artifacts do not keep file modes.
      - run: chmod +x target/release/extenddb
      - name: Check the current schema
        run: devtools/check-mongodb-schema ./target/release/extenddb schema-mongodb.txt 27071
      - name: Upload the regenerated schema
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: schema-mongodb
          path: schema-mongodb.txt
          if-no-files-found: ignore
      - name: Check serve and migrate on one catalog
        run: devtools/check-mongodb-catalog-lock ./target/release/extenddb 27041 18460
      - name: Check the commands and the server as a readWrite user
        run: devtools/check-mongodb-auth ./target/release/extenddb 27081 18490
      - name: Check the released catalogs against a fresh install
        run: devtools/check-mongodb-released ./target/release/extenddb 27061 18480
      - name: Check the last 0.1.x release against migrated catalogs
        run: |
          docker pull extenddb/extenddb-mongodb:0.1.14
          devtools/check-mongodb-older-binary ./target/release/extenddb \
            extenddb/extenddb-mongodb:0.1.14 27051 18470

  mongodb-production-build:
    runs-on: extenddb_ubuntu-2404_4-core
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          # Only pushes to main save, so other runs restore main's cache.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check production MongoDB feature graph
        run: cargo check --release --no-default-features --features mongodb

  mongodb-integration:
    runs-on: extenddb_ubuntu-2404_4-core
    timeout-minutes: 40
    needs: [mongodb-pytest, mongodb-rust, mongodb-backup-store, mongodb-catalog, mongodb-production-build, mongodb-snapshot]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.mongodb-pytest.result }}" != "success" ] || \
             [ "${{ needs.mongodb-rust.result }}" != "success" ] || \
             [ "${{ needs.mongodb-backup-store.result }}" != "success" ] || \
             [ "${{ needs.mongodb-catalog.result }}" != "success" ] || \
             [ "${{ needs.mongodb-production-build.result }}" != "success" ] || \
             [ "${{ needs.mongodb-snapshot.result }}" != "success" ]; then
            exit 1
          fi
      # Fails unless the shards together collected every test of the whole
      # suite exactly once, so a bad split cannot pass.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: shards-mongodb-pytest-*
          path: shards/mongodb-pytest
      - name: Check the shards ran every test
        run: python3 devtools/test-shards check shards/mongodb-pytest
