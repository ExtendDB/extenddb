name: Actions pinned
# Each `uses` value that names another repository's action or reusable
# workflow must name a full 40-character commit SHA. This workflow fails on a
# tag, a branch or any other ref in a workflow or an action of this
# repository. By convention the version goes in a trailing comment. Local
# actions (./...) and docker:// images are not pinned values.
#
# devtools/check-actions-pinned parses with PyYAML each workflow file in
# .github/workflows and each action.yml or action.yaml in the repository. It
# reads a value on the line after `uses:`, a step in flow style, a block
# scalar, an anchor and an alias as YAML reads them. It opens symlinked files
# through the link. It follows each local `uses: ./path` to the file that the
# path names. It reads booleans by the YAML 1.2 rules that GitHub uses. It
# fails when it finds no workflow file, when a file does not parse, and when a
# local action is missing. Its self-test runs first.
#
# The check is advisory until `pinned` is a required status check on main.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

# Same grouping as fmt.yml: a new push to a pull request supersedes its
# in-flight run, and every other run gets a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pinned:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # devtools/check-actions-pinned-requirements.txt pins PyYAML 6.0.3 by the
      # hash of its CPython 3.11 x86_64 Linux wheel, the one file that this job
      # installs. pip refuses any other file, builds nothing and installs no
      # dependency.
      - name: Install PyYAML
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r devtools/check-actions-pinned-requirements.txt

      - name: Run the check's self-test
        run: python devtools/check-actions-pinned --selftest

      - name: Check that every action reference is a commit SHA
        run: python devtools/check-actions-pinned
