# ExtendDB configuration: sample template
#
# Copy this file to extenddb.toml and edit as needed, or run `extenddb init`
# to generate one.
#
# SECURITY: This file may contain the encryption key for credential storage.
# Set permissions to 0600 (owner read/write only): chmod 600 extenddb.toml
# The server refuses to start if permissions are more permissive.
#
# Every key the server reads appears below exactly once, commented out, with
# its default as the value. Uncomment a line and change the value to override
# the default. A key whose description says it has no default shows an example
# value instead.
#
# Environment variable overrides use the EXTENDDB__ prefix with __ as the
# separator between levels:
#   EXTENDDB__SERVER__PORT=9000
#   EXTENDDB__STORAGE__POSTGRES__CONNECTION_STRING="postgresql://..."
# Precedence: CLI flags, then environment variables, then this file, then the
# built-in defaults.
#
# Runtime settings (log level, control plane delay, throttling at runtime) are
# changed with `extenddb settings set <key> <value>`, not in this file. The
# administration guide lists them under Runtime Settings.
#
# docs/configuration.md is generated from this file by
# `npm run gen:config` in website/; CI fails when the two differ.

# These keys sit at the top level and must appear before the first [section]
# header of the file. A top-level key placed after a header lands inside that
# table and the server refuses to start with "unknown field".

# Path to the rendered documentation directory (HTML and PDF files) produced
# by `python3 docs/build-docs.py`. When set, the web console serves the
# documentation at /console/docs; when absent, those routes show a "not
# configured" message. `extenddb init` discovers this directory when it
# exists. No default.
# docs_dir = "/path/to/docs/rendered"

# Maximum import file size in bytes. When set, it replaces
# limits.max_import_file_bytes, which carries the 10 GB default. No default.
# max_import_bytes = 10737418240

# Deprecated: a single root for both import and export. It fills only a list
# that the [import] and [export] sections leave empty, so with both sections
# present it does nothing, and with neither present it makes the import and
# export roots the same directory. The server logs which of those happened at
# startup. Prefer the sections; this key will be removed. No default.
# import_export_root = "/var/lib/extenddb/data"

[server]
# The listening socket and the per-server behaviour that is fixed at startup.
# The management web console is served at /console/ on the same address and
# port as the DynamoDB API and needs no configuration of its own; it requires
# auth.provider set to "builtin".

# Network interface to bind. The default listens on loopback only; bind
# 0.0.0.0 to accept connections from other hosts.
# bind_addr = "127.0.0.1"

# Listening port for the DynamoDB API, the management API and the console.
# port = 18443

# AWS region used when generating ARNs. Every backup ARN the server issues
# carries it, so the value must stay within [a-z0-9-]; the server logs a
# warning at startup for a value outside that class. See the upgrade manual
# before changing it on a deployment that has backups.
# region = "us-east-1"

# Directory for runtime files (the PID file). A leading ~ expands to $HOME.
# run_dir = "~/.extenddb/run"

# Provisioned throughput throttling via in-memory token buckets. When true,
# tables with provisioned capacity are rate limited to their configured RCU
# and WCU, on-demand tables use the default ceilings (12,000 RCU and 4,000
# WCU), and the account-level aggregate limits in [limits] apply. This key
# sets the value the server starts with; once the throttling_enabled runtime
# setting has been written with `extenddb settings set`, the runtime setting
# takes precedence. Unset means throttling is off. No default.
# throttling_enabled = false

[server.tls]
# TLS is mandatory. `extenddb init` generates a self-signed certificate;
# replace it with a CA-signed certificate for production use.

# Accepted for backward compatibility. The server refuses to start when this
# is set to false.
# enabled = true

# Path to the PEM certificate file. A leading ~ expands to $HOME.
# cert_path = "~/.extenddb/tls/cert.pem"

# Path to the PEM private key file. A leading ~ expands to $HOME.
# key_path = "~/.extenddb/tls/key.pem"

[storage]
# Each ExtendDB binary contains exactly one storage backend and reads the
# [storage.<backend>] section with that backend's name. The other
# [storage.*] sections are ignored, so one file can carry all four.

# Name of the storage backend this file is written for: "postgres",
# "sqlite", "mongodb" or "cassandra". The key is optional; when present it
# is checked against the binary's compiled-in backend and the server refuses
# to start on a mismatch. No default.
# backend = "postgres"

[storage.postgres]
# The connection string points to the catalog database, which stores table
# metadata and the connection information for the data database. Several
# independent catalogs can coexist on one PostgreSQL instance.
#
# Connection budget: pool_size sizes two pools, one against the catalog
# database and one against the data database, which `extenddb init` creates
# separately. Total PostgreSQL connections used: 2 * pool_size +
# catalog_pool_size, plus one per vector index build running on this server
# and one while a schema migration runs. PostgreSQL's max_connections is per
# cluster, not per database, so both pools draw on the same budget. The
# defaults need 60 of PostgreSQL's default 100. The index build session and
# the migration connection sit outside every pool: a build's ownership lock
# is session scoped, so it needs a session that ends when the build ends (a
# pooled connection would return to the pool still holding the lock); the
# migration lock is transaction scoped and needs a pinned connection, because
# its explicit transaction must keep one PostgreSQL backend until COMMIT, and
# a transaction-pooling proxy could otherwise move the lock between backends.
#
# Restores are bounded per server process: at most 4 per account and at most
# half of pool_size in total (after the minimum of 10 is applied, capped at
# 16; 10 with the default pool_size of 20). A restore that cannot get both
# within 30 seconds is refused with LimitExceededException. Each running
# restore holds one pooled connection for its whole copy plus one dedicated
# connection outside the pool for its lock. RestoreTableFromBackup holds a
# session-level advisory lock for the whole copy, so ExtendDB must reach the
# catalog database directly or through a session-mode pooler; behind a
# transaction-mode pooler (for example PgBouncer with pool_mode set to
# transaction) restore locks are not released and the abandoned-restore sweep
# can remove a restore that is still running.

# Connection string for the catalog database. For production add
# `?sslmode=require` and a password of your own.
# connection_string = "postgresql://extenddb:extenddb-local-dev@localhost:5432/extenddb_catalog"

# Maximum concurrent connections in each of the two data-operation pools.
# Minimum 10: smaller values are raised to 10 with a startup warning.
# Increase for higher concurrency and raise PostgreSQL's max_connections to
# at least 2 * pool_size + catalog_pool_size + the number of vector index
# builds you expect to overlap.
# pool_size = 20

# Maximum connections for the management and catalog pool (authorization,
# IAM, console). Minimum 10, raised with a startup warning. With auth enabled
# each DynamoDB request makes concurrent authorization queries, so size this
# to match the expected request concurrency. Defaults to pool_size when
# absent, so it has no value of its own.
# catalog_pool_size = 20

[storage.sqlite]
# Developer mode backend. Select it with `extenddb init --backend sqlite`.
# The database path can be given at init time (`extenddb init --sqlite-path
# <path>`, written into this file) or set here; at serve time the
# EXTENDDB__STORAGE__SQLITE__PATH environment variable overrides it.

# Database file. A relative path is resolved against the working directory
# when the configuration loads, before `serve` daemonizes. ":memory:" selects
# an ephemeral in-memory database whose data is lost on shutdown. Builds with
# the crate's memory feature default to ":memory:".
# path = "extenddb.sqlite"

# Connection pool size. Writes are serialized by the engine whatever the
# size. A file database raises a value of 1 to 2 and logs it at info, because
# a backup holds one reader connection for its whole duration while its
# batches write through another; use 3 or more so a running backup does not
# contend with ordinary requests. The process runs at most pool_size / 2 - 1
# backups at once (between 1 and 16; 4 with the default) and answers
# LimitExceededException to a CreateBackup that waited 30 seconds for a slot.
# pool_size = 10

[storage.mongodb]
# MongoDB requires a replica set, even a single-node one, because conditional
# writes and transactions use multi-document transactions.

# MongoDB connection string. Required; no default.
# connection_string = "mongodb://localhost:27017/?replicaSet=rs0"

# Maximum concurrent connections for data operations. Unset means 50. No
# default of its own.
# max_connections = 50

# Shared catalog and authorization pool for management and authorization
# traffic; size it for their combined concurrency. Unset means 20. No default
# of its own.
# max_catalog_connections = 20

# Read concern for the multi-document transactions behind conditional writes,
# TransactWriteItems, TransactGetItems and idempotency tokens. Accepted
# values: "snapshot", "majority" and "local". "snapshot" keeps the single
# point-in-time guarantee. Some MongoDB-wire-compatible servers reject
# "snapshot" transactions with CommandNotSupported (code 115); set "majority"
# or "local" only when required. Both lose the point-in-time guarantee and
# "local" may read data that is later rolled back after a failover. The
# server logs a startup warning for either.
# transaction_read_concern = "snapshot"

[storage.cassandra]
# Cassandra backend. Keyspaces are created with NetworkTopologyStrategy in the
# configured datacenter. One connection pool serves catalog and data traffic.

# Contact points as host:port strings. Required; no default.
# contact_points = ["localhost:9042"]

# Username for authentication. Omit for an unauthenticated cluster. No
# default.
# username = "cassandra"

# Password for authentication. Omit for an unauthenticated cluster. No
# default.
# password = "cassandra"

# Prefix of the keyspaces the backend creates.
# keyspace_prefix = "extenddb"

# Replication factor for the keyspaces the backend creates.
# replication_factor = 3

# Datacenter name used in NetworkTopologyStrategy.
# datacenter = "datacenter1"

# Maximum connections per host.
# max_connections = 10

[auth]
# Authentication is mandatory. Run `extenddb init` to create the encryption
# key and the admin user before the first start.

# Auth provider. "builtin" verifies SigV4 signatures against the local
# credential store and evaluates IAM policies. The server refuses to start
# with "none".
# provider = "builtin"

[auth.cache]
# In-memory stale-while-revalidate caches sit between the request path and
# the catalog database. Without them each request issues about six catalog
# queries during authentication and authorization; with them the steady state
# is close to none. Changes made through this server's admin API propagate
# at once by write-through invalidation. Changes made elsewhere (other nodes
# of a multi-node deployment, or direct database writes) take up to
# ttl_seconds to become visible. Statistics are exposed at
# /management/auth-cache-metrics (JSON, admin authenticated); the per-cache
# pass_through flag separates "cache disabled" from "cache cold".

# Kill switch. When false, the cache wrappers skip lookup, insert and
# eviction and forward every request to the catalog. Use it during incident
# response.
# enabled = true

# Hard time to live in seconds. Entries older than this trigger a fresh load
# that the request waits for.
# ttl_seconds = 60

# Stale-but-usable threshold in seconds. Entries older than this are returned
# at once while a background task refreshes them. Set it equal to ttl_seconds
# to disable refresh-ahead.
# soft_ttl_seconds = 30

# Time to live in seconds for negative results ("not found"). Short so newly
# created entities become usable quickly.
# negative_ttl_seconds = 5

# Maximum entries per cache; least recently used entries are evicted beyond
# it.
# max_entries = 10000

[limits]
# The defaults match the DynamoDB service quotas. Override them only to test
# edge cases.

# Maximum size of one item in bytes, attribute names and values included.
# max_item_size_bytes = 409600

# Maximum size of a partition key value in bytes.
# max_partition_key_size_bytes = 2048

# Maximum size of a sort key value in bytes.
# max_sort_key_size_bytes = 1024

# Maximum number of tables per account.
# max_tables_per_account = 2500

# Maximum number of global secondary indexes per table.
# max_gsis_per_table = 20

# Maximum number of local secondary indexes per table.
# max_lsis_per_table = 5

# Largest Limit value ListTables accepts, and its page size when Limit is
# absent.
# list_tables_max_per_page = 100

# Maximum length of a table name in characters.
# max_table_name_length = 255

# Minimum length of a table name in characters.
# min_table_name_length = 3

# Maximum provisioned read capacity units per table.
# per_table_max_rcu = 40000

# Maximum provisioned write capacity units per table.
# per_table_max_wcu = 40000

# Maximum aggregate read capacity units across the account, enforced when
# throttling is enabled.
# per_account_max_rcu = 80000

# Maximum aggregate write capacity units across the account, enforced when
# throttling is enabled.
# per_account_max_wcu = 80000

# Preview extension: allow multi-part (composite) keys on base tables. When
# false, base tables follow the DynamoDB rule of one HASH key and at most one
# RANGE key. Global secondary indexes allow multi-part keys regardless.
# allow_multipart_table_keys = false

# Maximum attribute name size in bytes (REQ-LIM-004, 64 KB).
# max_attribute_name_bytes = 65535

# Maximum number of tokens in one expression (condition, update, projection
# or key condition).
# max_expression_tokens = 4096

# Maximum size of one expression string in bytes, measured on the text before
# #name and :value substitution.
# max_expression_length_bytes = 4096

# Maximum nesting depth in condition expressions (parentheses, NOT, AND and
# OR).
# max_expression_depth = 150

# Maximum IAM policy document size in bytes, measured before JSON parsing.
# max_policy_document_bytes = 6144

# Maximum import file size in bytes (10 GB). The top-level max_import_bytes
# key replaces this value when set.
# max_import_file_bytes = 10737418240

# Maximum number of items in one import.
# max_import_item_count = 10000000

# Maximum number of items in one export.
# max_export_item_count = 10000000

# Reject bare reserved keywords in expressions, as the service does.
# enforce_reserved_keywords = true

[logging]
# Output always goes to syslog (facility daemon, ident extenddb); read it with
# `journalctl -t extenddb`. The level set here is the one the server starts
# with; the log_level runtime setting changes it without a restart.

# Log level: "trace", "debug", "info", "warn" or "error".
# level = "info"

# Log format: "pretty" for humans or "json" for structured output.
# format = "pretty"

[import]
# Import and export file operations are disabled until a directory is listed
# here. Every file path is canonicalized and must resolve under one of the
# configured roots; a symlink that escapes a root is rejected. Files are
# namespaced per account beneath each root: a caller in account 111122223333
# may only read under <root>/111122223333, and a path that resolves elsewhere
# is rejected, so tenants sharing an instance cannot read each other's files.

# Directories imports may read from, for example /var/lib/extenddb/imports.
# Empty means imports are denied.
# paths = []

[export]
# Same rules as [import]. Export refuses to overwrite an existing file.

# Directories exports may write to, for example /var/lib/extenddb/exports.
# Empty means exports are denied.
# paths = []
