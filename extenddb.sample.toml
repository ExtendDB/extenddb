# extenddb configuration — sample template
#
# Copy this file to extenddb.toml and edit as needed.
# Or run `extenddb init` to generate one automatically.
#
# SECURITY: This file may contain the encryption key for credential storage.
# Set permissions to 0600 (owner read/write only): chmod 600 extenddb.toml
# The server refuses to start if permissions are more permissive.
#
# All values shown are defaults. Uncomment and change to override.
#
# Environment variable overrides use the EXTENDDB__ prefix with __ as separator:
#   EXTENDDB__SERVER__PORT=9000
#   EXTENDDB__STORAGE__POSTGRES__CONNECTION_STRING="postgresql://..."

# Path to the rendered documentation directory (HTML + PDF files).
# Generated by `python3 docs/build-docs.py`. When set, the web console
# serves documentation at /console/docs. When absent, the docs routes
# show a "not configured" message.
# `extenddb init` auto-discovers this directory if it exists.
# docs_dir = "/path/to/docs/rendered"

[server]
# bind_addr = "127.0.0.1"      # Network interface to bind (default: localhost only)
# port = 18443                 # HTTP port
# region = "us-east-1"         # AWS region for ARN generation
# run_dir = "~/.extenddb/run"  # Directory for PID file (~ is expanded to $HOME)

[storage]
# backend = "postgres"         # Storage backend: "postgres" (default), "mongodb", or "sqlite".

# --- SQLite backend (developer mode) ---
# Select with `extenddb init --backend sqlite`. The database path can be given
# at init time (`extenddb init --sqlite-path <path>`, written into this file)
# or set here. At serve time, the EXTENDDB__STORAGE__SQLITE__PATH environment
# variable overrides this value.
# Use ":memory:" for an ephemeral in-memory database (data lost on shutdown).
# [storage.sqlite]
# path = "extenddb.sqlite"

[storage.postgres]
# Connection string points to the CATALOG database.
# The catalog stores table metadata and the data database connection info.
# Multiple independent catalogs can coexist on one PostgreSQL instance.
# connection_string = "postgresql://extenddb:extenddb-local-dev@localhost:5432/extenddb_catalog"
# pool_size = 20               # Maximum concurrent database connections
                                # for DynamoDB data operations. Default: 20.
                                # Minimum: 10 (smaller values are clamped with
                                # a startup warning). This value sizes TWO
                                # pools: one against the catalog database and
                                # one against the data database, which `init`
                                # always creates separately. Total PostgreSQL
                                # connections used: 2 * pool_size +
                                # catalog_pool_size + [backup] max_concurrent_jobs
                                # (one claim connection per running backup or
                                # restore job), plus one per vector index
                                # build running on this server and one while a
                                # schema migration runs. max_connections is
                                # per cluster, not per database, so both pools
                                # draw on the same budget. The claim connections,
                                # the build session and the migration connection
                                # sit OUTSIDE every pool, for different reasons.
                                # A build's ownership lock is SESSION-scoped, so
                                # it needs a session that ends when the build
                                # ends: a pooled connection returns to the pool
                                # still holding the lock. The migration lock is
                                # TRANSACTION-scoped and needs a pinned
                                # connection instead, because its explicit
                                # transaction must retain one PostgreSQL backend
                                # until COMMIT; a transaction-pooling proxy could
                                # otherwise let the lock move between backends.
                                # Increase for higher concurrency; ensure
                                # PostgreSQL max_connections >= 2 * pool_size
                                # + catalog_pool_size + max_concurrent_jobs +
                                # the number of vector index builds you expect
                                # to overlap. The defaults already need 64 of
                                # PostgreSQL's default 100.
# catalog_pool_size = 20       # Maximum concurrent connections for the
                                # management/catalog pool (authz, IAM, console).
                                # Defaults to pool_size if not set.
                                # Minimum: 10 (smaller values are clamped with
                                # a startup warning). With auth enabled, each
                                # DynamoDB request makes concurrent authz queries
                                # — size this to match expected concurrency.

[storage.mongodb]
# MongoDB connection string. Requires a replica set (even single-node).
# connection_string = "mongodb://localhost:27017/?replicaSet=rs0"
# max_connections = 50         # Maximum concurrent data-operation connections.
# max_catalog_connections = 20 # Shared catalog/auth pool for management and
                                # authorization traffic; size for their combined
                                # concurrency.
# transaction_read_concern = "snapshot"
                                # Read concern for the multi-document transactions
                                # backing conditional writes, TransactWriteItems,
                                # TransactGetItems, and idempotency tokens. Accepted
                                # values: "snapshot", "majority", and "local".
                                # "snapshot" is the default, fidelity-preserving mode.
                                # Some MongoDB-wire-compatible backends (e.g.
                                # DocumentDB) reject "snapshot" transactions with
                                # CommandNotSupported (115); set this to "majority"
                                # or "local" only when required. Both lose the
                                # single point-in-time guarantee; "local" may read
                                # data later rolled back after failover.

[auth]
# provider = "builtin"          # Auth provider:
                                #   "builtin" — SigV4 verification with local credential
                                #               store and IAM policy evaluation.
                                # Authentication is mandatory. The server refuses to start
                                # with provider = "none". Run `extenddb init` to create the
                                # encryption key and admin user before first start.

[auth.cache]
# In-memory stale-while-revalidate caches sit between the request hot path
# and the catalog database. Each request would otherwise issue ~6 catalog
# queries during auth/authz; caching reduces this to ~0 in steady state.
#
# Self-induced changes (admin API mutations) propagate instantly via
# write-through invalidation. Off-instance changes (multi-node deployments
# or direct DB writes) take up to `ttl_seconds` to propagate.
# enabled = true                # Master kill switch. When false, the
                                # cache wrappers bypass moka entirely
                                # (no lookup, no insert, no LRU pressure)
                                # and forward every request to the catalog.
                                # Use during incident response.
# ttl_seconds = 60              # Hard TTL — entries older than this trigger
                                # a fresh, request-blocking load.
# soft_ttl_seconds = 30         # Stale-but-usable threshold. Older entries
                                # are returned immediately while a background
                                # task refreshes them. Set equal to
                                # ttl_seconds to disable refresh-ahead.
# negative_ttl_seconds = 5      # Negative-cache TTL for "not found" results.
                                # Short by design so newly-created entities
                                # become usable quickly.
# max_entries = 10000           # Per-cache LRU cap.

# Management web console is served at /console/ on the same port as the
# DynamoDB API. No separate configuration needed — it uses the same bind
# address and port as [server]. The console requires auth.provider = "builtin"
# (it authenticates against the admin_users and iam_users tables).

# Provisioned throughput throttling via in-memory token buckets.
# When enabled, tables with provisioned capacity are rate-limited to their
# configured RCU/WCU. On-demand tables use default ceilings (12,000 RCU /
# 4,000 WCU). Account-level aggregate limits also apply.
# Disabled by default — enable for production-like behavior.
# throttling_enabled = false

[server.tls]
# TLS is mandatory. The server refuses to start with enabled = false.
# cert_path = "~/.extenddb/tls/cert.pem"   # PEM certificate file
# key_path = "~/.extenddb/tls/key.pem"     # PEM private key file
# `extenddb init` generates a self-signed certificate automatically.
# Replace with a CA-signed certificate for production use.

[limits]
# All defaults match real DynamoDB limits.
# Override only for testing edge cases.
#
# max_attribute_name_bytes = 65535  # REQ-LIM-004: 64 KB
#
# Preview extension: allow multi-part (composite) keys on base tables.
# GSIs always support multi-part keys regardless of this setting.
# allow_multipart_table_keys = false
#
# Bulk operations (StartBulkPutItems and the workers that drive it).
# These settings are ExtendDB's own; DynamoDB does not expose them.
# max_concurrent_bulk_operations = 50        # per account
# bulk_operation_retention_days = 30
# bulk_operation_worker_concurrency = 4      # operations running at once per process
# bulk_operation_worker_per_account = 2      # of those, at most this many per account
# bulk_operation_lease_seconds = 60
# bulk_put_batch_size = 25                   # rows per checkpoint
# bulk_put_write_batch_rows = 25             # rows per storage transaction; capped at 100 and by bulk_put_batch_size
# max_bulk_input_bytes = 10737418240         # enumerated (compressed) total per operation; Start rejects above it
# max_bulk_input_files = 50000               # enumerated object count per operation; above it the operation fails
# max_bulk_input_object_bytes = 5368709120   # one enumerated input object; above it the operation fails
# max_bulk_client_token_bytes = 1024         # longest accepted ClientToken on StartBulkPutItems, in bytes
# max_bulk_line_bytes = 4194304              # one input line; longer abandons the file
# max_bulk_item_count = 100000000            # rows read per operation; more fails the operation
# max_bulk_report_records = 1000000          # records kept per operation; more are dropped and logged
# max_bulk_report_bytes = 1073741824         # serialized bytes of records kept per operation; more are dropped and logged
# max_bulk_failed_starts_per_hour = 100      # terminal-born starts per account per hour; above it Start answers ThrottlingException
# bulk_put_write_units_per_second = 80000    # ceiling on bulk writes per process, in 1 KB write units per second; 0 disables

[logging]
# level = "info"               # Log level: trace, debug, info, warn, error
# format = "pretty"            # Log format: "pretty" (human) or "json" (structured)
#
# Logging output is determined by the launch mode:
#   extenddb serve → syslog (facility: daemon, ident: extenddb)
#   Read logs with: journalctl -t extenddb
# No configuration needed — output always goes to syslog.

# [backup]
# Backup and restore jobs and the reconciler. Every key has a default; the
# section may be left out. stale_job_after_secs must be at least three
# heartbeat periods, the larger of heartbeat_interval_secs and the 15 s the
# jobs of this release heartbeat at (45 at the least); max_concurrent_jobs is
# at most 1024; on PostgreSQL pool_size and catalog_pool_size are raised to
# at least 2 * max_concurrent_jobs + 10.
# data_file_target_bytes = 67108864    # Uncompressed bytes per data file (minimum 32 MiB)
# heartbeat_interval_secs = 15         # Job heartbeat timer
# stale_job_after_secs = 300           # Heartbeat age after which a job's owner is dead
# failed_row_retention_secs = 604800   # FAILED tombstones kept for the operator (7 days)
# reconcile_interval_secs = 60         # Reconciler cycle
# max_concurrent_jobs = 4              # Backup and restore jobs running at once on this instance
# spool_path = "/var/lib/extenddb/spool" # Restore download area for an S3 store

# Import/Export file operations are disabled by default (secure default).
# Configure allowed directories separately for imports and exports.
# All file paths are canonicalized and must resolve under one of the
# configured roots. Symlinks escaping a root are rejected.
#
# Files are namespaced per account beneath each root: a caller in account
# 111122223333 may only read and write under <root>/111122223333. A path that
# resolves elsewhere is rejected, so tenants sharing an instance cannot read or
# overwrite each other's files. Export refuses to overwrite an existing file.
#
# [import]
# paths = ["/var/lib/extenddb/imports"]
#
# [export]
# paths = ["/var/lib/extenddb/exports"]
#
# max_import_bytes = 10737418240  # 10 GB default
#
# Deprecated: import_export_root sets a single root for both import and export.
# It fills only a list that the sections leave empty, so with both [import] and
# [export] present it does nothing, and with neither present it makes the import
# and export roots the same directory. The server logs which of those happened at
# startup. Prefer the sections above; this key will be removed.
#
# It is a top-level key, so it has to appear before the first [section] header of
# this file. Uncommenting it here would place it inside the preceding table and
# the server would refuse to start with "unknown field import_export_root".
#     import_export_root = "/var/lib/extenddb/data"

# Bulk operations ([bulk]) are disabled by default (secure default). The bulk
# put operations read their input files and write their error reports through
# one store, independent of [import] and [export]. store selects it:
# "filesystem" or "s3".
#
# The filesystem store reads and writes beneath one root. The layout is
# {path}/{account id}/{S3Bucket}/...: the server creates {path} and the
# per-account directories; the caller creates the bucket directories beneath
# its own subtree and stages files there.
#
# Whoever can write beneath {path}/{account id} can feed data into any table
# that account starts a load on, so an account's subtree is as trusted as the
# mechanism that populates it.
#
# [bulk]
# store = "filesystem"
#
# [bulk.filesystem]
# path = "/var/lib/extenddb/buckets"
#
# The S3 store reads and writes the buckets the requests name, in AWS S3 or in
# an S3-compatible service at endpoint_url, with the credentials of the
# standard AWS credential chain (environment variables, the shared config and
# credentials files, web identity, container and instance credentials). This
# file holds no credentials, and [bulk.s3] is checked at startup whatever
# store selects. region defaults to [server] region and is one host label of
# lowercase letters, digits and hyphens; most S3-compatible services need
# force_path_style = true. An http:// endpoint_url must be loopback
# (127.x.y.z, ::1 or localhost) unless allow_insecure_endpoint = true, which
# accepts it and logs a warning at startup. Requests and responses to such an
# endpoint cross the network unencrypted.
#
# Every caller reaches the buckets the server's credentials reach, as far as
# its ExtendDB policies allow s3:ListBucket, s3:GetObject and s3:PutObject on
# them; nothing else separates ExtendDB accounts on this store, and dev mode
# evaluates no policy.
#
# [bulk]
# store = "s3"
#
# [bulk.s3]
# region = "us-east-1"
# endpoint_url = "https://objects.example.internal:9000"
# allow_insecure_endpoint = false
# force_path_style = true

# Runtime settings are managed via `extenddb settings set <key> <value>`, not this file.
# See docs/getting-started.md for available runtime settings and their defaults.

# --- Production Configuration Example ---
# Uncomment and adapt the following for production deployments:
#
# [server]
# bind_addr = "0.0.0.0"
# port = 18443
#
# [server.tls]
# cert_path = "/etc/extenddb/tls/cert.pem"
# key_path = "/etc/extenddb/tls/key.pem"
#
# [storage.postgres]
# connection_string = "postgresql://extenddb:<password>@db.example.com:5432/extenddb_catalog?sslmode=require"
# pool_size = 50
# catalog_pool_size = 50
#
# [auth]
# provider = "builtin"
#
# [logging]
# level = "info"
# format = "json"
