# Copyright 2026 ExtendDB contributors
# SPDX-License-Identifier: Apache-2.0
#
# The non-standard accepted identifiers below are covered by the self-service
# distribution screening recorded in the ExtendDB container publishing ticket.
accepted = [
    "Apache-2.0",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

# Build dependencies can contribute generated/native code to the final binary;
# dev dependencies are not part of the runtime image.
ignore-build-dependencies = false
ignore-dev-dependencies = true
ignore-transitive-dependencies = false

targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
