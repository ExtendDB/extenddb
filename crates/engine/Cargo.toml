[package]
name = "extenddb-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Operation dispatch, input validation and DynamoDB error mapping of the ExtendDB server. Internal crate of the extenddb binary, with no API stability promise."
repository.workspace = true
homepage.workspace = true

[features]
default = ["partiql"]
# Kill-point pauses in the backup job (`EXTENDDB_BACKUP_PAUSE`), for the
# binary-level crash tests; never enabled in a release build.
backup-test-hooks = []
# PartiQL surface (ExecuteStatement, BatchExecuteStatement, ExecuteTransaction),
# a pure translation over the existing data-plane handlers. Removable: with this
# off, the three operations are not known and the server answers them with
# UnknownOperationException exactly as before.
partiql = ["extenddb-core/partiql"]

[dependencies]
extenddb-auth = { workspace = true }
extenddb-core = { workspace = true }
extenddb-storage = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
crc32fast = { workspace = true }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
futures = { workspace = true }
# A `std::time` drop-in that re-exports `std::time` on every target except
# wasm32-unknown-unknown, where it backs the clock with the browser APIs. The stream iterator
# timestamps read the clock and compile into the wasm32 build, so they go
# through this.
web-time = { workspace = true }

# The store-backed backup subsystem and the import/export file I/O depend on
# an S3/filesystem store (`extenddb-backup-store`) and the tokio
# networking/`fs`/`spawn` and `tokio-util` machinery, none of which build for
# wasm32. They are compiled only off wasm; the modules that use them are gated
# the same way (`backup` in lib.rs, `files` in import_export.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
extenddb-backup-store = { workspace = true }
tokio = { workspace = true }
# `TaskTracker` for the backup jobs the server drains at shutdown;
# `StreamReader` and `SyncIoBridge` for the restore's in-place decode of a
# store object on the blocking pool.
tokio-util = { workspace = true, features = ["rt", "io", "io-util"] }
# The chunks the backup writer hands to the upload (`backup/job/writer.rs`).
bytes = { workspace = true }

# The workspace `full` tokio feature pulls in `mio` (networking), which has no
# wasm32 target. The wasm-reachable engine surface (dispatch, the data-plane
# and stream handlers) uses only the runtime/sync/time/macros API. Target-scoped
# and additive; native keeps the workspace `full` set above.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
# `start_paused` for the tests of timers that must not depend on the wall clock.
tokio = { workspace = true, features = ["test-util"] }
# A storage engine for the tests that need an `OperationContext`.
extenddb-storage-sqlite = { path = "../storage-sqlite" }
# Scratch directories that are removed when a test panics.
tempfile = "3"

# `tests/private_modes.rs` sets umask 0.
[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }
