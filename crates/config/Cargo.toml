[package]
name = "extenddb-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Configuration types and loading of the ExtendDB server. Internal crate of the extenddb binary, with no API stability promise."
repository.workspace = true
homepage.workspace = true

[features]
# Developer mode: `is_tls_enabled` reports plain HTTP regardless of the
# configured TLS state, and `server.catalog_upgrade` defaults to "apply".
# Enabled only through the app crate's `dev-mode` feature.
dev-mode = []

[dependencies]
extenddb-core = { workspace = true }
extenddb-storage = { workspace = true }
extenddb-backup-store = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
config = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
