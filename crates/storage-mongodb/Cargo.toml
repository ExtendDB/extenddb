[package]
name = "extenddb-storage-mongodb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Enables deterministic coordination hooks used only by the MongoDB integration
# test binary (the mongodb-test-hooks server build). Production builds do not
# compile these hooks.
test-hooks = []
# Compiles the snapshot page-size setter, the open pause and the shared
# snapshot conformance check the crate's snapshot tests use. Separate from
# `test-hooks` so the crate's own tests build the production commit and
# backfill paths, not the coordination hooks.
snapshot-test-hooks = ["extenddb-storage/test-hooks"]

[dependencies]
# Internal crates
extenddb-core.workspace = true
extenddb-storage.workspace = true
extenddb-auth.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
bson.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Async
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true

# MongoDB driver
mongodb.workspace = true

# Crypto & checksums
uuid.workspace = true
base64.workspace = true
bcrypt.workspace = true
aes-gcm.workspace = true
rand.workspace = true
zeroize.workspace = true

# Time
time.workspace = true

# Logging
tracing.workspace = true

# Checksums
crc32fast.workspace = true

# In-process GSI existence cache
dashmap.workspace = true

[dev-dependencies]
# Property-based testing for the filter-pushdown parity harness
# (crates/storage-mongodb/tests/pushdown_parity.rs).
proptest = "1"
# The crate's snapshot tests need `snapshot-test-hooks`; a dev-dependency on
# itself turns it on for test builds only.
extenddb-storage-mongodb = { path = ".", features = ["snapshot-test-hooks"] }
