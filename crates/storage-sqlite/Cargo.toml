[package]
name = "extenddb-storage-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SQLite storage backend of the ExtendDB server. Internal crate of the extenddb binary, with no API stability promise."
repository.workspace = true
homepage.workspace = true

[features]
# Compile the in-memory (`:memory:`) database in as the default storage path,
# yielding a zero-config, ephemeral, bootstrap-on-serve deployment (no `init`,
# no file on disk). Without this feature the backend is file-backed and the path
# must be configured as usual.
memory = []
# Compiles the snapshot page-size setter the consistency test uses and the
# shared conformance check. Production builds do not compile them.
test-hooks = ["extenddb-storage/test-hooks"]

[dependencies]
extenddb-core = { workspace = true }
extenddb-storage = { workspace = true }
extenddb-auth = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
base64 = { workspace = true }
bcrypt = { workspace = true }
rand = { workspace = true }
bigdecimal = { workspace = true }
crc32fast = { workspace = true }
zeroize = { workspace = true }
web-time = { workspace = true }

# Storage transport, split per target. Native keeps `sqlx` (SQLite feature) and
# the C `libsqlite3-sys`; native SQLite is the behaviour this backend is
# defined against. On a browser
# `wasm32-unknown-unknown` target neither can run — `sqlx-sqlite` dedicates an
# OS thread to each connection and `libsqlite3-sys` needs a C sysroot — so both
# are dropped and the crate's `sqlx::` paths resolve instead to the in-crate
# `wasm_sqlx` module (aliased to `sqlx` at the crate root), a synchronous
# reimplementation of the slice of the `sqlx` API this backend uses. It drives
# `sqlite-wasm-rs` (a SQLite bundled for wasm with an in-memory VFS, no threads,
# no sysroot) over its raw libsqlite3 C ABI. Both targets run the same SQL
# text.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sqlx = { workspace = true, features = ["sqlite"] }
# SQLite's C API, for the online-backup copy and the registration of the
# `extenddb_scan_segment` SQL function, which sqlx does not expose. The
# version is the one `sqlx-sqlite` depends on.
libsqlite3-sys = { workspace = true }
# `flock(2)` for the one-owner-per-file serve lock and `statvfs(3)` for the
# free-space check before the copy a migration takes (Unix only).
libc = { workspace = true }
# The workspace `full` tokio feature pulls in `mio` (networking), which has no
# wasm32 target. Native keeps the workspace `full` set; the wasm build below
# takes only the runtime/sync/time/macros API, which the crate's wasm32 code
# uses (for example tasks, mutexes, semaphores, timers and select!).
tokio = { workspace = true, features = ["sync"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Real SQLite compiled for wasm with an in-memory VFS (no threads, no C
# sysroot, no Emscripten). The `wasm_sqlx` shim drives its raw libsqlite3 C ABI
# synchronously, standing in for sqlx, and `sqlite_util.rs` calls the same C
# ABI to register `extenddb_scan_segment`, standing in for libsqlite3-sys. The
# `wasm-bindgen` feature supplies the runtime host hooks (clock, randomness, VFS
# glue) the module links against in a JavaScript host. 0.6.3 is the first
# release that bundles SQLite 3.54.1 (0.6.0 to 0.6.2 bundle 3.53.4), and 0.6.0
# and 0.6.1 do not compile with clang 15, which rejects the C23 `[[noreturn]]`
# attribute their shim header uses.
sqlite-wasm-rs = { version = "0.6.3", features = ["wasm-bindgen"] }
# `rt-multi-thread` is deliberately absent: a browser wasm module is
# single-threaded.
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# The same floor as extenddb-core's wasm-bindgen-test, for the reason its
# manifest gives.
wasm-bindgen-test = "0.3.80"

# The native test dependencies pull the engine, the backup store and tokio's
# full (net) stack, none of which build for wasm32. Scoping them off wasm lets
# the wasm32 shim integration test (`tests/wasm_shim.rs`) compile against only
# the crate, its dependencies and `wasm-bindgen-test`; every other target gets
# the full set.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
extenddb-storage = { path = "../storage", features = ["test-util"] }
# `tests/backup_job_panic.rs` drives the engine's CreateBackup job and
# reconciler against a `SqliteEngine` (the engine depends on `extenddb-storage`,
# not on this crate, so the edge is acyclic).
extenddb-engine = { path = "../engine" }
extenddb-backup-store = { path = "../backup-store" }
# The slow-statement test sets sqlx's threshold, a `log` level, and prints
# every tracing event of a child process.
log = "0.4"
tracing-subscriber = { workspace = true }
# The crate's own tests need `test-hooks`; a dev-dependency on itself turns
# the feature on for test builds only.
extenddb-storage-sqlite = { path = ".", features = ["test-hooks"] }
