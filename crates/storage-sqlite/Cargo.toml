[package]
name = "extenddb-storage-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Compile the in-memory (`:memory:`) database in as the default storage path,
# yielding a zero-config, ephemeral, bootstrap-on-serve deployment (no `init`,
# no file on disk). Without this feature the backend is file-backed and the path
# must be configured as usual.
memory = []
# Compiles the snapshot page-size setter the consistency test uses and the
# shared conformance check. Production builds do not compile them.
test-hooks = ["extenddb-storage/test-hooks"]

[dependencies]
extenddb-core = { workspace = true }
extenddb-storage = { workspace = true }
extenddb-auth = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["sqlite"] }
tokio = { workspace = true, features = ["sync"] }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
base64 = { workspace = true }
bcrypt = { workspace = true }
aes-gcm = { workspace = true }
rand = { workspace = true }
bigdecimal = { workspace = true }
crc32fast = { workspace = true }
zeroize = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
# The crate's own tests need `test-hooks`; a dev-dependency on itself turns
# the feature on for test builds only.
extenddb-storage-sqlite = { path = ".", features = ["test-hooks"] }
