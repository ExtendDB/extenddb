[package]
name = "extenddb-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Core types, validation, errors and limits of the ExtendDB server. Internal crate of the extenddb binary, with no API stability promise."
repository.workspace = true
homepage.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
bigdecimal = { workspace = true }
flate2 = { workspace = true }
md-5 = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }
# A `std::time` drop-in that also works on wasm32. On every target except
# wasm32-unknown-unknown it is `pub use std::time::*`;
# on wasm32-unknown-unknown it backs `Instant`/`SystemTime` with the browser clock
# (`performance.now()` / `Date.now()`) instead of the host monotonic/realtime
# clocks, which are unavailable there and panic at runtime if called.
web-time = { workspace = true }

# The shared crypto module (src/crypto.rs) uses AWS-LC through aws-lc-rs on
# every target except wasm32. The server already links aws-lc-rs through
# rustls, and the extenddb binary through rcgen as well, so this edge adds no
# package to their builds; it adds AWS-LC to the dependency closure of
# extenddb-core itself.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
aws-lc-rs = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# On wasm32-unknown-unknown `uuid`'s v4 generator needs one of its `js`,
# `rng-getrandom` or `rng-rand` features to name a randomness source, and
# fails to compile without one. With `js` it calls the Web Crypto
# `crypto.getRandomValues` through its own wasm-bindgen binding, not through
# getrandom.
uuid = { workspace = true, features = ["js"] }
# Pure-Rust crypto backend for wasm32 (src/crypto.rs): HMAC-SHA256 via `hmac`
# over `sha2`, constant-time compare via `subtle`, AES-256-GCM via `aes-gcm`,
# and randomness via `getrandom`'s browser backend. `aes-gcm` runs with default
# features off (dropping its built-in getrandom 0.2 RNG, which does not build on
# wasm32); the nonce is drawn from getrandom 0.3 directly.
hmac = "0.12"
subtle = "2"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc", "zeroize"] }
# Each crate in the AES-256-GCM stack wipes only its own key material, and only
# under its own `zeroize` feature: aes-gcm wipes the GHASH key it derives, aes
# the AES round keys, ghash the keys it derives for POLYVAL, and polyval the
# POLYVAL key and state. aes-gcm's feature does not enable the others, so they
# are named here only to turn the feature on.
aes = { version = "0.8", features = ["zeroize"] }
ghash = { version = "0.5", features = ["zeroize"] }
polyval = { version = "0.6", features = ["zeroize"] }
# 0.3.4 is the lowest release this build compiles with: from 0.3.4 the
# `wasm_js` feature alone selects the browser backend on
# wasm32-unknown-unknown, where 0.3.0 to 0.3.3 also need
# `--cfg getrandom_backend="wasm_js"` in RUSTFLAGS and fail to compile without
# it (getrandom's CHANGELOG for 0.3.4).
getrandom = { version = "0.3.4", features = ["wasm_js"] }
# On wasm32 the `time` crate's `OffsetDateTime::now_utc()` reads the clock via
# `std::time::SystemTime::now()`, which panics on wasm32-unknown-unknown. The
# `wasm-bindgen` feature makes it read `js_sys::Date` instead. This feature
# unifies across the whole wasm build, so every crate that calls `now_utc()`
# benefits. Target-scoped to wasm32; native builds do not enable it.
time = { workspace = true, features = ["wasm-bindgen"] }

[dev-dependencies]
hex = "0.4"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["partiql"]
# PartiQL grammar, AST and query planning. Removable: with this off, the
# `partiql` module is not compiled and nothing else in core references it.
partiql = []
