[package]
name = "extenddb-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command-line interface of the ExtendDB server, shared by every backend build. Internal crate of the extenddb binary, with no API stability promise."
repository.workspace = true
homepage.workspace = true

[features]
default = ["search-inequality-filters"]
# Developer mode: plain HTTP on loopback, open authorization (SigV4
# authentication still enforced), seeded dev credential. A build-time profile
# for local development and CI. The thin bin enforces that it is paired with the
# `sqlite` backend.
dev-mode = ["extenddb-config/dev-mode"]
mongodb-test-hooks = ["extenddb-server/mongodb-test-hooks"]
backup-test-hooks = ["extenddb-server/backup-test-hooks"]
# SearchVectors inequality filters: the extended SearchConditionExpression
# grammar (comparators, BETWEEN, IN, OR, NOT, attribute_exists and
# attribute_not_exists) for the accounts the `search_inequality_filters`
# runtime setting names, every account when it is absent. On by default.
# The workspace takes the server without its default features, so this
# feature decides the server's: with it off, the server and the engine are
# built without it, SearchVectors accepts only an AND of equalities, and
# `settings` has no `search_inequality_filters` key.
search-inequality-filters = ["extenddb-server/search-inequality-filters"]

[dependencies]
extenddb-auth = { workspace = true }
extenddb-core = { workspace = true }
extenddb-engine = { workspace = true }
extenddb-storage = { workspace = true }
extenddb-config = { workspace = true }
extenddb-server = { workspace = true }
extenddb-backup-store = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
base64 = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
# The connection string that `encryption-key reset` and `set-data-connection`
# read from standard input, wiped when it drops.
zeroize = { workspace = true }

# Daemon mode (double-fork, PID files, SIGTERM) is POSIX-only; on Windows the
# server runs with `serve --foreground` under an external supervisor.
[target.'cfg(unix)'.dependencies]
daemonize = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
# The encryption-key commands' tests run on a SQLite file catalog.
extenddb-storage-sqlite = { path = "../storage-sqlite" }
tempfile = "3"
