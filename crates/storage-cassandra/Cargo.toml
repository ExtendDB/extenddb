[package]
name = "extenddb-storage-cassandra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Apache Cassandra storage backend of the ExtendDB server (experimental). Internal crate of the extenddb binary, with no API stability promise."
repository.workspace = true
homepage.workspace = true

[dependencies]
extenddb-core = { workspace = true }
extenddb-storage = { workspace = true }
extenddb-auth = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
base64 = { workspace = true }
bcrypt = { workspace = true }
rand = { workspace = true }
bigdecimal = { workspace = true }
crc32fast = { workspace = true }
zeroize = { workspace = true }
cdrs-tokio = { workspace = true }
# Not used in the code. It holds cdrs-tokio's protocol crate on 4.0.x. The
# root Cargo.toml gives the reason.
cassandra-protocol = { workspace = true }
chrono = { workspace = true }

[features]
# Entry points the integration tests build catalogs with.
test-util = ["extenddb-storage/test-util"]
# Coordination hooks used only by this crate's integration test binary
# (`src/test_hooks.rs`). Production builds do not compile them. Enabling it
# also arms `extenddb_storage::backup_catalog::restore_pause_point`, the
# `bulk_load` kill point the restore kill-point harness drives.
test-hooks = ["extenddb-storage/test-hooks"]

[dev-dependencies]
extenddb-storage = { path = "../storage", features = ["test-util"] }
extenddb-storage-cassandra = { path = ".", features = ["test-util"] }
# The move's claim test runs the engine's `--move-store` over this backend and
# a filesystem store (the engine depends on `extenddb-storage`, not on this
# crate, so the edge is acyclic).
extenddb-engine = { path = "../engine" }
extenddb-backup-store = { path = "../backup-store" }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
