[package]
name = "extenddb-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# `test-util` exposes `migrations::check_released`, the checksum test each
# backend crate runs on its migration table, and
# `password::count_verifications`, which returns the bcrypt cost of each check
# a login ran. It also compiles the counter in `verify_password` that records
# those costs. Production code never enables it.
test-util = []
# Compiles the `snapshot_conformance` check that each backend's tests run
# against a real database. Production builds do not compile it.
test-hooks = []
# The item-history store trait of point-in-time recovery. Off by default; the
# engine and the SQL backends enable it with their own `pitr` features.
pitr = []

[dependencies]
async-trait = { workspace = true }
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
bcrypt = { workspace = true }
bigdecimal = { workspace = true }
extenddb-auth = { workspace = true }
extenddb-core = { workspace = true }
futures = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# `start_paused` for the retention worker's test, whose first sweep runs an
# hour after start.
tokio = { workspace = true, features = ["test-util"] }
