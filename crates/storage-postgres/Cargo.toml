[package]
name = "extenddb-storage-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Compiles the snapshot page-size setter the consistency test uses and the
# shared conformance check. Production builds do not compile them.
test-hooks = ["extenddb-storage/test-hooks"]

[dev-dependencies]
# The storage-level vector control-plane tests drive the engine directly against
# a scratch database, so they need a runtime and the test macro.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The crate's own tests need `test-hooks`; a dev-dependency on itself turns
# the feature on for test builds only.
extenddb-storage-postgres = { path = ".", features = ["test-hooks"] }

[dependencies]
anyhow = { workspace = true }
extenddb-core = { workspace = true }
extenddb-storage = { workspace = true }
extenddb-auth = { workspace = true }
futures = { workspace = true }
sqlx = { workspace = true }
pgvector = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
crc32fast = { workspace = true }
rand = { workspace = true }
bcrypt = { workspace = true }
aes-gcm = { workspace = true }
async-trait = { workspace = true }
zeroize = { workspace = true }
urlencoding = { workspace = true }

