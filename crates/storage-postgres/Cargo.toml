[package]
name = "extenddb-storage-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dev-dependencies]
# The storage-level vector control-plane tests drive the engine directly against
# a scratch database, so they need a runtime and the test macro.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The checksum test checks this backend's migration table with the framework's
# test helper.
extenddb-storage = { workspace = true, features = ["test-util"] }
# This crate's integration tests reach its test hooks.
extenddb-storage-postgres = { path = ".", features = ["test-util"] }

[features]
# Test hooks: the runner without a lock, the lock and the registration with
# another keepalive interval, the serving session's settings, and the
# post-check's definitions.
test-util = ["extenddb-storage/test-util"]

[dependencies]
anyhow = { workspace = true }
extenddb-core = { workspace = true }
extenddb-storage = { workspace = true }
extenddb-auth = { workspace = true }
futures = { workspace = true }
sqlx = { workspace = true }
pgvector = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
crc32fast = { workspace = true }
rand = { workspace = true }
bcrypt = { workspace = true }
aes-gcm = { workspace = true }
async-trait = { workspace = true }
zeroize = { workspace = true }
urlencoding = { workspace = true }
libc = { workspace = true }

