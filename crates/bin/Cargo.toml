[package]
name = "extenddb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A DynamoDB-compatible API server that stores data in PostgreSQL, MongoDB, Cassandra or SQLite."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["dynamodb", "database", "nosql", "server", "postgresql"]
categories = ["database-implementations", "command-line-utilities"]

[[bin]]
name = "extenddb"
path = "src/main.rs"

[features]
default = ["postgres"]
postgres = ["extenddb-storage-postgres"]
cassandra = ["extenddb-storage-cassandra"]
sqlite = ["extenddb-storage-sqlite"]
# Build the SQLite backend in its zero-config, ephemeral in-memory mode.
sqlite-memory = ["sqlite", "extenddb-storage-sqlite/memory"]
mongodb = ["extenddb-storage-mongodb"]
# MongoDB integration-test build with deterministic backfill coordination hooks.
mongodb-test-hooks = [
    "mongodb",
    "extenddb-storage-mongodb/test-hooks",
    "extenddb-app/mongodb-test-hooks",
]
# Developer mode: plain HTTP on loopback, open authorization (SigV4
# authentication still enforced), seeded dev credential. A build-time profile
# for local development and CI. It compiles only with `sqlite` or
# `sqlite-memory`. A build of any other backend with it, `postgres` among them,
# fails (`main.rs` checks this at compile time). A production `sqlite` build
# leaves it off.
dev-mode = ["extenddb-app/dev-mode"]
# Use mimalloc as the global allocator in place of the system allocator. Off by
# default. See ADR-0030 for the measurements.
mimalloc = ["dep:mimalloc"]

[dependencies]
extenddb-app = { workspace = true }
extenddb-storage = { workspace = true }
extenddb-storage-cassandra = { workspace = true, optional = true }
extenddb-storage-mongodb = { workspace = true, optional = true }
extenddb-storage-postgres = { workspace = true, optional = true }
extenddb-storage-sqlite = { workspace = true, optional = true }
anyhow = { workspace = true }
extenddb-config = { workspace = true }
mimalloc = { workspace = true, optional = true }

[dev-dependencies]
sqlx = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
extenddb-storage = { path = "../storage", features = ["test-util"] }
