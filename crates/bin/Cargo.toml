[package]
name = "extenddb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "extenddb"
path = "src/main.rs"

[features]
default = ["postgres"]
postgres = ["extenddb-storage-postgres"]
cassandra = ["extenddb-storage-cassandra"]
sqlite = ["extenddb-storage-sqlite"]
# Build the SQLite backend in its zero-config, ephemeral in-memory mode.
sqlite-memory = ["sqlite", "extenddb-storage-sqlite/memory"]
mongodb = ["extenddb-storage-mongodb"]
# MongoDB integration-test build with deterministic backfill coordination hooks.
mongodb-test-hooks = [
    "mongodb",
    "extenddb-storage-mongodb/test-hooks",
    "extenddb-app/mongodb-test-hooks",
]
# Developer mode: plain HTTP on loopback, open authorization (SigV4 still
# enforced), seeded dev credential. A build-time profile for local development
# and CI. It compiles only with `sqlite` or `sqlite-memory`. A build of any other
# backend with it, `postgres` among them, fails (`main.rs` checks this at compile
# time). A production `sqlite` build leaves it off.
dev-mode = ["extenddb-app/dev-mode"]

[dependencies]
extenddb-app = { workspace = true }
extenddb-storage = { workspace = true }
extenddb-storage-cassandra = { workspace = true, optional = true }
extenddb-storage-mongodb = { workspace = true, optional = true }
extenddb-storage-postgres = { workspace = true, optional = true }
extenddb-storage-sqlite = { workspace = true, optional = true }
anyhow = { workspace = true }
extenddb-config = { workspace = true }

[dev-dependencies]
sqlx = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
extenddb-storage = { workspace = true, features = ["test-util"] }
