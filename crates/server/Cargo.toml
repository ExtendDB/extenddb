[package]
name = "extenddb-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
mongodb-test-hooks = []

[dependencies]
extenddb-cache = { workspace = true }
extenddb-core = { workspace = true }
extenddb-config = { workspace = true }
extenddb-engine = { workspace = true }
extenddb-storage = { workspace = true }
extenddb-auth = { workspace = true }
futures = { workspace = true }
axum = { workspace = true }
async-trait = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hyper = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
crc32fast = { workspace = true }
uuid = { workspace = true }
metrics = { workspace = true }
anyhow = { workspace = true }
bcrypt = { workspace = true }
# IAM tag charset validation needs the exact Unicode general categories
# (\p{L}, \p{N}, \p{Z}); char::is_alphabetic / is_numeric are not those sets.
unicode-properties = "0.1.4"
base64 = { workspace = true }
time = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
axum-server = { workspace = true }
rustls = { workspace = true }
tracing-subscriber = { workspace = true }

# POSIX syslog is the daemon-mode log target; neither crate compiles on
# Windows, where `serve --foreground` (stderr logging) is the only mode.
[target.'cfg(unix)'.dependencies]
syslog-tracing = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
extenddb-cache = { workspace = true, features = ["test-util"] }
# The bulk authorization tests drive `authorize_request` against a real
# `AppState`. The server crate is backend-agnostic at runtime (it holds an
# `Arc<dyn StorageEngine>`), so a concrete backend appears here only as a
# test dependency; the sqlite in-memory database gives each test an
# isolated engine with no file on disk, matching the engine crate's tests.
extenddb-storage-sqlite = { workspace = true, features = ["memory"] }
