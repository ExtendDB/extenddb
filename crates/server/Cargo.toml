[package]
name = "extenddb-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "HTTP layer of the ExtendDB server, which serves the DynamoDB wire protocol. Internal crate of the extenddb binary, with no API stability promise."
repository.workspace = true
homepage.workspace = true

[features]
mongodb-test-hooks = []
# The backup and restore jobs' kill-point pauses (`EXTENDDB_BACKUP_PAUSE`),
# for the binary-level crash tests. The engine's points are its own feature;
# the points inside the backends' writes (`restore_sqlite_mid_batch`,
# `restore_postgres_before_progress_delete`,
# `restore_mongodb_after_insert_many`, `restore_cassandra_before_progress`)
# are calls of `extenddb_storage::backup_catalog::restore_pause_point`, so
# `extenddb-storage/test-hooks` arms them in whichever backend the build
# selects without naming a backend crate here (the server depends on none).
backup-test-hooks = ["extenddb-engine/backup-test-hooks", "extenddb-storage/test-hooks"]

[dependencies]
extenddb-cache = { workspace = true }
extenddb-core = { workspace = true }
extenddb-config = { workspace = true }
extenddb-engine = { workspace = true }
extenddb-storage = { workspace = true }
extenddb-backup-store = { workspace = true }
extenddb-auth = { workspace = true }
futures = { workspace = true }
axum = { workspace = true }
async-trait = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hyper = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
crc32fast = { workspace = true }
uuid = { workspace = true }
metrics = { workspace = true }
anyhow = { workspace = true }
bcrypt = { workspace = true }
# IAM tag charset validation needs the exact Unicode general categories
# (\p{L}, \p{N}, \p{Z}); char::is_alphabetic / is_numeric are not those sets.
unicode-properties = "0.1.4"
base64 = { workspace = true }
time = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
axum-server = { workspace = true }
rustls = { workspace = true }
tracing-subscriber = { workspace = true }

# POSIX syslog is the daemon-mode log target; neither crate compiles on
# Windows, where `serve --foreground` (stderr logging) is the only mode.
[target.'cfg(unix)'.dependencies]
syslog-tracing = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
extenddb-cache = { path = "../cache", features = ["test-util"] }
# The login tests count bcrypt checks with `count_verifications` against an
# in-memory SQLite catalog.
extenddb-storage = { path = "../storage", features = ["test-util"] }
extenddb-storage-sqlite = { path = "../storage-sqlite" }
sqlx = { workspace = true, features = ["sqlite"] }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
