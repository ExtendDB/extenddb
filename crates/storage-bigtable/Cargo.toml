[package]
name = "extenddb-storage-bigtable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Google Cloud Bigtable storage backend of the ExtendDB server (experimental). Internal crate of the extenddb binary, with no API stability promise."
repository.workspace = true
homepage.workspace = true

[dependencies]
extenddb-core = { workspace = true }
extenddb-storage = { workspace = true }
extenddb-auth = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
moka = { workspace = true }
sha2 = { workspace = true }
crc32fast = { workspace = true }
bigdecimal = { workspace = true }
urlencoding = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

# BigTable client + admin stubs
bigtable_rs = { workspace = true }
googleapis_tonic_google_bigtable_v2 = { workspace = true }
googleapis_tonic_google_bigtable_admin_v2 = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
gcp_auth = { workspace = true }
rustls = { workspace = true }

# Crypto
rand = { workspace = true }
bcrypt = { workspace = true }
base64 = { workspace = true }
axum = { workspace = true }

[features]
# Coordination and fault-injection hooks used only by this crate's integration
# test binary (`tests/emulator_integration.rs`). Production builds do not
# compile them.
test-hooks = ["extenddb-storage/test-hooks"]

[dev-dependencies]
extenddb-storage = { path = "../storage", features = ["test-util"] }
tokio = { workspace = true, features = ["full"] }
