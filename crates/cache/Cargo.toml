[package]
name = "extenddb-cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "In-memory stale-while-revalidate cache used by the ExtendDB auth and server layers. Internal crate of the extenddb binary, with no API stability promise."
repository.workspace = true
homepage.workspace = true

[features]
# `test-util` exposes test-only helpers like `SwrCache::run_pending_tasks`
# to consumers outside this crate. Production code never enables this.
test-util = []

[dependencies]
# `web-time` is a drop-in replacement for `std::time` that also compiles on
# wasm32; on every target except wasm32-unknown-unknown it is
# `pub use std::time::*`.
web-time = { workspace = true }
moka = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }

# Native keeps the full tokio feature set inherited from the workspace. On
# wasm32 the workspace's `full` feature pulls in `mio` (networking), which has
# no wasm32 target and fails to compile. The cache's only production use of
# tokio is the background-refresh `tokio::spawn`, which needs just `rt`.
# The native entry below keeps the workspace feature set.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
