[package]
name = "extenddb-wasm-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "WebAssembly binding layer that runs the ExtendDB engine over an in-memory SQLite database in the browser, replacing the network edge with a direct in-process call. Internal crate with no API stability promise."
repository.workspace = true
homepage.workspace = true
# Not a published crate: it is the browser build's binding layer, not part of
# the released library set. Keeping it out of the registry keeps the published
# set at the count the release policy fixes.
publish = false

[lib]
# `cdylib` is the wasm module `wasm-bindgen` emits for the browser;
# `rlib` keeps the crate usable as a normal Rust library so native tests and
# `cargo build -p extenddb-wasm-adapter` (the wasm build-check) work.
crate-type = ["cdylib", "rlib"]

[features]
# The engine is taken with its default features off (the workspace entry), so
# this crate names the search-inequality-filters feature for the engine, core
# and the SQLite backend together. Without it the engine would compile the
# extended search grammar out while core and the backend compile it in, and
# the browser build would serve the equality-only grammar.
# devtools/compile-out-search-inequality-filters removes it from this default
# list as from the others.
default = ["search-inequality-filters"]
search-inequality-filters = [
    "extenddb-core/search-inequality-filters",
    "extenddb-engine/search-inequality-filters",
    "extenddb-storage-sqlite/search-inequality-filters",
]

[dependencies]
extenddb-auth = { workspace = true }
extenddb-core = { workspace = true }
# The workspace entry turns the engine's default features off and this crate
# asks for none, so a build of this crate alone (`-p extenddb-wasm-adapter`,
# native or wasm32) has no `partiql` feature; a native build of the whole
# workspace has it, because the server asks for the engine's defaults. The
# browser build's refusal of the PartiQL operations does not depend on it:
# this crate refuses them before dispatch (`unsupported_reason` in
# src/runtime.rs). The engine's PartiQL surface needs an item authorizer the
# browser build does not install, and its snapshot path reads the backup
# runtime, which the wasm engine build does not carry.
extenddb-engine = { workspace = true }
extenddb-storage = { workspace = true }
# The in-browser backend: the SQLite storage engine opened on a `:memory:`
# database. The `memory` cargo feature is deliberately not enabled — it only
# changes `SqliteConfig::default().path`, and would unify across the whole
# workspace; this crate opens `:memory:` explicitly through `new_in_memory`.
extenddb-storage-sqlite = { workspace = true }
serde_json = { workspace = true }

# The JS <-> wasm boundary. Only the browser build needs it, so it is
# target-scoped to wasm32; native builds (and the native unit tests) compile
# the portable `runtime` module without any wasm-bindgen surface. `js-sys`
# supplies the `Promise` the async `submit` resolves; `wasm-bindgen-futures`
# drives the engine's async dispatch on the browser microtask queue;
# `console_error_panic_hook` writes a wasm panic's message and stack to
# `console.error` before the trap that follows the panic.
#
# The first three floors are the releases that wasm-bindgen-test 0.3.80,
# the floor extenddb-core, extenddb-storage-sqlite and this crate give the
# harness of their wasm tests, requires exactly, so no lower release of them
# resolves in this workspace.
# console_error_panic_hook 0.1.6 is the first release whose hook adds the
# JavaScript stack to the message; 0.1.0 to 0.1.4 need a nightly compiler
# (they use `#![feature]`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
console_error_panic_hook = "0.1.6"

# A current-thread runtime drives the adapter's async `submit` in the native
# tests (the browser build uses `wasm-bindgen-futures` instead). Scoped to
# non-wasm so `cargo clippy -p extenddb-wasm-adapter --target
# wasm32-unknown-unknown --all-targets` does not pull tokio's net stack, which
# has no wasm32 target.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

# The harness that runs tests/parity.rs on wasm32 under Node; the same floor
# as extenddb-core's wasm-bindgen-test, for the reason its manifest gives.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.80"
