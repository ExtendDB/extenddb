[package]
name = "extenddb-backup-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Backup object store abstraction with filesystem and S3 implementations."

[dependencies]
aws-config = { workspace = true }
aws-sdk-s3 = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["io"] }
tracing = { workspace = true }
uuid = { workspace = true }

[features]
# Failure-injection seam for the crate's own test suite; not part of the
# supported API surface and never enabled by production consumers.
test-util = []

[dev-dependencies]
extenddb-backup-store = { path = ".", features = ["test-util"] }
tempfile = "3"
toml = { workspace = true }
