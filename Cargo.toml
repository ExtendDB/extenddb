[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cache",
    "crates/engine",
    "crates/storage",
    "crates/config",
    "crates/storage-postgres",
    "crates/storage-mongodb",
    "crates/storage-sqlite",
    "crates/storage-bigtable",
    "crates/auth",
    "crates/server",
    "crates/app",
    "crates/bin",
]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
# Internal crates
extenddb-core = { path = "crates/core" }
extenddb-cache = { path = "crates/cache" }
extenddb-engine = { path = "crates/engine" }
extenddb-storage = { path = "crates/storage" }
extenddb-config = { path = "crates/config" }
extenddb-storage-postgres = { path = "crates/storage-postgres" }
extenddb-storage-mongodb = { path = "crates/storage-mongodb" }
extenddb-storage-sqlite = { path = "crates/storage-sqlite" }
extenddb-storage-bigtable = { path = "crates/storage-bigtable" }
extenddb-auth = { path = "crates/auth" }
extenddb-server = { path = "crates/server" }
extenddb-app = { path = "crates/app" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Async
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7" }
async-trait = "0.1"
futures = "0.3"

# HTTP
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-gzip", "cors", "set-header"] }
hyper = { version = "1" }
urlencoding = { version = "2.1" }

# Caching
moka = { version = "0.12", features = ["future"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "json", "time", "uuid", "bigdecimal"] }
mongodb = "3"
bson = "2.13"
dashmap = "6"

# Crypto & checksums
crc32fast = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
bigdecimal = { version = "0.4", features = ["serde"] }
bcrypt = "0.17"
aes-gcm = "0.10"
rand = "0.9"

# Time
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

# TLS
axum-server = { version = "0.8", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
rustls-pemfile = "2"
rcgen = "0.14"

# Process management
daemonize = "0.5"
libc = "0.2"

# Logging & metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
syslog-tracing = "0.3"
metrics = "0.24"

# Config
clap = { version = "4", features = ["derive"] }
config = "0.14"

# Security
zeroize = { version = "1.8", features = ["derive"] }

# BigTable
bigtable_rs = "0.3"
googleapis_tonic_google_bigtable_v2 = { package = "googleapis-tonic-google-bigtable-v2", version = "0.36" }
googleapis_tonic_google_bigtable_admin_v2 = { package = "googleapis-tonic-google-bigtable-admin-v2", version = "0.44" }
tonic = { version = "0.14", features = ["tls-native-roots"] }
prost = "0.14"
prost-types = "0.14"
hyper-util = "0.1"
gcp_auth = "0.12"

